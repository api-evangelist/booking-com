name: Booking.com client packages
summary: >-
  Booking.com publishes NO first-party API client library, in any language, on any registry. This is not
  a search gap: the developer documentation offers curl examples and an in-portal "Try out" console and
  never links a client library; the bookingcom GitHub organisation's 91 public repositories are
  engineering infrastructure (Bazel rules, Graphite tooling, Kubernetes operators, ML datasets, Perl
  packaging) with no API SDK among them; and every npm package matching "booking.com" is third-party.
