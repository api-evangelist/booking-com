finding: >-
  For a company shipping 210 published operations across 20 contracts, zero first-party SDKs is the
  single largest developer-experience gap in this profile. Every integrator hand-rolls an HTTP client,
  and the decay signal an SDK release date would give a buyer does not exist here at all.
