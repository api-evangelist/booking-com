findings:
- id: security-txt-expired
  detail: 'https://www.booking.com/.well-known/security.txt returns 200 text/plain with Contact: https://hackerone.com/bookingcom,
    Contact: mailto:appsecurity@booking.com, Preferred-Languages: en, and Expires: 2025-12-31T23:00:00.000Z.
    RFC 9116 requires the Expires value to be in the future; it is over eight months past at probe time,
    so the file is formally stale.'
- id: api-hosts-401-not-404
  detail: demandapi.booking.com, demandapi-sandbox.booking.com and partnerships-status.booking.com return
    401 with an empty body on every /.well-known/ path. This is a gate, not an absence - we cannot say
    whether those hosts serve discovery documents behind it.
- id: no-api-catalog
  detail: No host serves /.well-known/api-catalog, although developers.booking.com does maintain a machine-readable
    API catalogue behind its MCP server.
