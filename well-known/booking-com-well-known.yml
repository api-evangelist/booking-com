name: Booking.com /.well-known/ probe
summary: Two real documents are served. booking.com and www.booking.com serve a security.txt naming the
  HackerOne programme - but its Expires field is 2025-12-31, so it is EXPIRED under RFC 9116 as of this
  probe. developers.booking.com serves a conformant A2A agent card that points at a live anonymous MCP
  server. No openid-configuration, oauth-authorization-server, api-catalog or ai-plugin.json is served
  on any host. Every API host (demandapi, demandapi-sandbox, partnerships-status) answers 401 to anonymous
  requests, so their /.well-known/ space could not be read rather than being known-absent.
