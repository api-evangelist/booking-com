  test_cards: []
  test_bank_accounts: []
time_simulation:
  test_clocks: false
  detail: No time-travel or clock-advance facility is documented.
triggers_and_fixtures_tooling:
  detail: >-
    Behaviour is selected by choosing a test property rather than by firing a trigger. There is no
    fixture or event-trigger API.
rate_limits:
  requests_per_minute: 50
  note: Non-configurable sandbox limit; exceeding it returns 429.
try_it_console:
  available: true
  detail: >-
    The developer portal has a "Try out" console; the sandbox environment must be selected in it before
    sending a request.
constraints:
- Sandbox IDs used against production return an error or empty results.
- Sandbox is for testing and discovery only.
connectivity_note: >-
  This sandbox covers the Demand API only. The Connectivity (supply) APIs have no equivalent public
  sandbox; their specifications carry "About Try it" sections tied to the portal console and a machine
  account.
