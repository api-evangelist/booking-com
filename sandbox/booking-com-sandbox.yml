method: searched
source: https://developers.booking.com/demand/docs/getting-started/sandbox
docs: https://developers.booking.com/demand/docs/getting-started/sandbox
name: Booking.com Demand API sandbox
summary: >-
  Booking.com runs a real, fully documented sandbox for the Demand API with published test inventory. It
  is not a key-separated test mode: the sandbox uses the SAME credentials as production and is separated
  only by host and by the set of test property IDs, so there is no test-vs-live key prefix an agent can
  inspect to tell which environment a call will hit.
environments:
- name: Sandbox
  base_url: https://demandapi-sandbox.booking.com/3.2
  note: >-
    The version segment must match the version being integrated against; the sandbox mirrors the
    behaviour of the corresponding API version.
- name: Production
  base_url: https://demandapi.booking.com/3.2
key_modes:
  separate_test_keys: false
  key_prefix_test: null
  key_prefix_live: null
  detail: >-
    "No sandbox-specific API keys are required. Use your standard API Key token and Affiliate id for your
    requests." The only environment signal is the hostname.
supported_flows:
- flow: Search, look and book (search, availability, reservation, modification, cancellation)
  services: [Accommodations]
- flow: Search, look and redirect
  services: [Attractions (Beta)]
not_supported:
- service: Car rentals
  detail: The cars API collection is not available in the sandbox; Booking.com directs partners to production for it.
