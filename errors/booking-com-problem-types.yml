method: searched
source: >-
  https://developers.booking.com/demand/docs/support/error-handling/about-errors and
  .../error-codes, cross-checked against the 4xx/5xx responses declared in openapi/.
docs:
- https://developers.booking.com/demand/docs/support/error-handling/about-errors
- https://developers.booking.com/demand/docs/support/error-handling/error-codes
- https://developers.booking.com/demand/docs/support/error-handling/http-4xx-scenarios
