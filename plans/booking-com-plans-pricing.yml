plan_count: 0
description: >-
  Booking.com publishes no API plans, no tiers, no quotas and no prices. Both programmes are
  revenue-share rather than subscription, and the rates are contractual rather than published. The
  affiliate programme (Demand API) is free to join through the CJ affiliate network and pays a
  commission on qualified bookings, with the commission rate not stated on the public page. The
  Connectivity programme (supply APIs) requires an approved property or channel-manager relationship and
  is settled through Booking.com's commission on bookings. Neither page names a figure, so plan_count is
  0 rather than a tier list.
access_models:
- name: Affiliate Partner programme (Demand API)
  gate: registration through an affiliate network (CJ), free to join
  commercial_model: commission on qualified bookings
  published_rate: false
  signup: https://www.booking.com/affiliate-program/v2/index.html
  note: >-
    Registration is self-serve and free; the page states "Join us - it's free and easy" and "Earn a
    commission on qualified bookings made through your integrations" without naming a percentage.
    API keys are generated afterwards in the Affiliate Partner Centre.
- name: Connectivity Partner programme (supply APIs)
  gate: approved connectivity provider / property manager relationship
  commercial_model: Booking.com commission per booking on the properties connected
  published_rate: false
  signup: https://connect.booking.com/
plans: []
notes:
- >-
  This is an honest zero, not a gap in our search. The pricing surface exists and is public; it simply
  contains no numbers. Recording an invented tier here would misrepresent a commission business as a
  subscription one.
