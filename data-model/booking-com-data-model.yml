- from: accommodation
  to: property
  type: has_one
  via: same Booking.com identifier, seen from the demand and supply sides
  note: >-
    Inferred from the identifier space, not stated in the documentation. Treat as high-confidence but
    undeclared.
notes:
- >-
  There is no customer or booker entity with its own identifier. The booker travels inside the order
  payload (platform, country, email) and is not addressable afterwards.
- >-
  No metadata field exists on any entity, so an integrator cannot attach its own keys to a Booking.com
  object and must keep its own mapping table.
