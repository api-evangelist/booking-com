generated: '2026-09-17'
method: derived
source: >-
  Derived from openapi/booking-com-demand-api-3-2-openapi.yml (398 component schemas) and the
  Connectivity supply contracts in openapi/, with entity naming checked against
  https://developers.booking.com/demand/docs.
name: Booking.com entity model
summary: >-
  Two disjoint object graphs share one identifier space. The DEMAND graph is read-then-transact -
  accommodation, product, availability, order - and hangs everything off the accommodation id and the
  order id. The SUPPLY graph is the same physical property seen from the other side - property, room,
  rate plan, reservation, payout - keyed on the Booking.com property id. The accommodation id in the
  Demand API and the property id in the Connectivity API denote the same hotel, which is the single most
  useful fact in this model and is not stated anywhere in the docs.
id_conventions:
  accommodation_id:
    type: signed integer
    example: 10004
    note: Also called property id on the supply side.
  attraction_id:
    type: opaque string, 12 characters
    example: PRGrwINoiRZl
    note: A "PR" prefix is observed on every published sandbox attraction id.
  request_id:
    type: ULID-shaped string
    example: 01kjan7r7yvff5yg95gxy1cjhy
    note: Correlation id on every Demand API response envelope, not an entity key.
  location_ids:
    type: signed integer
    note: >-
      Cities, countries, regions, districts, landmarks and airports each carry their own integer id
      space, resolved through the /common/locations/* endpoints. City ids can be negative (e.g. -2140479).
entities:
- name: accommodation
  domain: demand
  key: id
  description: A bookable property - hotel, apartment, home. The root of the demand graph.
  operations: ['/accommodations/search', '/accommodations/details', '/accommodations/availability', '/accommodations/details/changes']
- name: product
  domain: demand
  key: id
  description: A sellable room-plus-policy combination inside an accommodation, priced for a stay.
- name: availability
  domain: demand
  key: id
  description: A priced, date-bounded offer for a product, carrying the cancellation policy schedule.
- name: cancellation_policy
  domain: demand
  key: null
  description: >-
    An ordered fee schedule, each entry carrying `from` (ISO 8601 date-time or the literal "now") and the
    fee that applies from that moment. The machine-readable reversal window.
- name: order
  domain: demand
  key: id
  description: A booking envelope containing one or more travel services.
  operations: ['/orders/preview', '/orders/create', '/orders/details', '/orders/modify', '/orders/cancel']
- name: reservation
  domain: both
  key: reservation_id
  description: >-
    One accommodation or car travel service inside an order. Visible to the supply side as a reservation
    on the property.
- name: car
  domain: demand
  key: id
  description: A rentable vehicle offer, sourced from a supplier and collected at a depot.
- name: depot
  domain: demand
  key: id
  description: A car rental pick-up/drop-off location, with its own review scores.
- name: supplier
  domain: demand
  key: id
  description: The car rental company behind a car offer.
- name: attraction
  domain: demand (beta)
  key: id
  description: A bookable experience; search-look-redirect rather than search-look-book.
- name: review
  domain: demand
  key: null
  description: Guest review text and score attached to an accommodation or depot.
- name: message
  domain: demand (beta) and connectivity
  key: id
  description: A guest-partner message inside a conversation; may be redacted for phishing (is_redacted, Messaging API 1.3).
- name: property
  domain: connectivity
  key: property_id
  description: The supply-side view of an accommodation - settings, status, description, health.
  operations: [Property API, Property Health API]
- name: room
  domain: connectivity
  key: room_id
  description: A room type on a property, carrying occupancy, extra beds configuration and facilities.
- name: rate_plan
  domain: connectivity
  key: null
  description: A pricing and restriction plan attached to rooms; derived plans reference a parent plan.
- name: facility
  domain: connectivity
  key: id
  description: >-
    A property- or room-level amenity. Single-instance (toggle or parameterised) or multi-instance.
    Carries OTA HAC / RMA code mappings.
- name: charge
  domain: connectivity
  key: null
  description: A fee applying at property or room level for a date range; carries legacy OTA FTT codes.
- name: value_add
  domain: connectivity
  key: null
  description: A catalogue entry of extras available to a property, with currency and amount attributes.
- name: payout
  domain: connectivity
  key: null
  description: Money owed to the partner for reservations, broken down per reservation.
- name: virtual_credit_card
  domain: connectivity
  key: null
  description: A VCC issued for a reservation, with balance, fees and refundability.
- name: reconciliation_report
  domain: connectivity
  key: null
  description: An asynchronously generated payout report over a date range and property set.
- name: contract
  domain: connectivity
  key: null
  description: A partner contract and its legal entity, created by invitation through the Contracting API.
relationships:
