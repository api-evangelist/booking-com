status_page:
  public_page: false
  api: true
  url: https://developers.booking.com/demand/docs/additional-services/status-api/about
  spec: openapi/booking-com-status-api-openapi.yml
  host: https://partnerships-status.booking.com
  detail: >-
    Booking.com publishes no human status page - status.booking.com does not resolve and
    developers.booking.com/status is a 404. Instead it ships a Status API: a machine-readable operational
    status of monitored Demand API endpoint groups, intended to drive automated responses such as
    adjusting retry behaviour or switching to a fallback. The host answers 401 anonymously, so the feed
    is partner-gated - an agent cannot check Booking.com's health without credentials.
sla:
  published: false
  detail: No public SLA, uptime commitment or credit schedule is published for either programme.
support:
