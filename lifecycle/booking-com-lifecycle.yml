name: Booking.com API lifecycle
summary: >-
  Booking.com publishes one of the more complete deprecation regimes in travel: named definitions, a
  dated public table covering 30 retirements back to 2021, a stated runtime signal for both the
  deprecated and the sunset state, and named migration guides. What it does NOT publish is an SLA, a
  public status page, or a fixed minimum notice period - the notice window is set per retirement and
  has ranged from two weeks to two years.
versioning:
  scheme: URL path segment, per product
  demand_api:
    current: '3.2'
    also_published: ['3.1', 3.2-Beta]
    detail: >-
      Each version is a separate published OpenAPI document. 3.1 remains available and documented; the
      3.2-Beta track carries attractions, transfers, smart search, messaging and car availability ahead
      of GA.
  connectivity:
    detail: >-
      Endpoints version individually rather than as a suite - OTA_HotelProductNotif 1.0/1.1/1.2, rooms
      1.2/1.3, OTA_HotelRatePlanNotif 1.0/2.0 - and older versions are retired on the published table.
deprecation_policy:
  published: true
  url: https://developers.booking.com/connectivity/docs/deprecation-policy/deprecation-and-sunsetting
  definitions:
    solution: Any API product, feature or service - often an entire endpoint, part of an endpoint, or a single attribute.
    deprecation: >-
      Booking.com no longer intends to improve, update or actively support the solution technically or
      commercially. It remains usable, and business-critical bugs may still be fixed.
    sunsetting: The solution is no longer available at all.
    deprecation_announcement: Communicated ahead of the deprecation date so partners can plan the migration.
  runtime_signals:
    deprecated:
      whole_endpoint: A warning is returned in the response HEADER from the deprecation date.
      partial_endpoint: A warning is returned in the `warnings` array (JSON) or `<warnings>` element (XML) of the response body.
    sunset:
      behaviour: Calling a sunset endpoint or element returns HTTP 400 Bad request.
  rfc8594:
    sunset_header: false
    deprecation_header: false
    note: >-
      Booking.com does return a header warning on deprecation, but it does not document the RFC 8594
      Sunset header or the RFC 8594-style Deprecation header by name, and neither appears in the 20
      published specs. The mechanism is equivalent in intent but not in form, so a generic RFC 8594
      client will not pick it up.
  minimum_notice: not published
  notice_observed_range: 14 days to 24 months, from the published table
