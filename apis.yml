- aid: booking-com:booking-com-historical-reservations-api
  name: Booking.com Historical Reservations API
  description: >-
    Retrieve a property's historical reservation details to initialise or reconcile reservation data for
    revenue management. Room reservations are selected by creation timestamp and optionally by status,
    and responses carry stay dates, available occupancy and guest and property price perspectives. Preview
    reference for version 1.0; access requires a connection authorised to read the property's reservation
    history.
