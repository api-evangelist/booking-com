description: 'Booking.com is the world''s largest online travel agency, part of Booking Holdings, listing more than
  28 million accommodation options plus car rentals, flights, attractions and airport transfers in over 60,000 destinations.
  It runs two distinct API programmes. The Demand API serves affiliate partners who want to search, price and book
  Booking.com inventory inside their own product; the Connectivity platform serves the supply side - channel managers,
  property management systems and hotel groups keeping rooms, rates, availability, content, reservations and payouts
  in sync. Twenty OpenAPI descriptions covering 210 operations are published through the developer portal, and the
  Connectivity estate additionally speaks OpenTravel Alliance (OTA) and Booking.com''s own B.XML message formats.
  Both programmes are credentialed: keys come from the Affiliate Partner Centre or from a machine account in the
  Connectivity Portal, and no API host answers an anonymous request.'
