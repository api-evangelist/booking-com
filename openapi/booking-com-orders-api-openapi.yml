  /orders/modify/preview:
    post:
      summary: Preview order modification
      description: 'Preview whether a requested modification can be applied to an order and retrieve the expected cost impact before confirming the change.


        Use this endpoint to:


        - Check if the requested modification can be applied.

        - Review the updated total cost (for accommodation changes).


        Note: This endpoint does not apply any changes to the order.'
      operationId: /orders/modify/preview
      parameters:
      - $ref: '#/components/parameters/AffiliateIdHeader'
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - title: Preview accommodation date modification
                description: Preview a change to the check-in and check-out dates for an accommodation reservation.
                allOf:
                - $ref: '#/components/schemas/accommodationModificationPreviewInput'
                - properties:
                    modification:
                      properties:
                        accommodation:
                          properties:
                            type:
                              const: dates
                            change:
                              $ref: '#/components/schemas/preview_dateChange'
                example:
                  order: '6520081014'
                  modification:
                    accommodation:
                      reservation: '6187285715'
                      type: dates
                      change:
                        checkin: '2026-04-19'
                        checkout: '2026-04-21'
              - title: Preview accommodation room modification
                description: Preview a change to the room or guest details for an accommodation reservation.
                allOf:
                - $ref: '#/components/schemas/accommodationModificationPreviewInput'
                - properties:
                    modification:
                      properties:
                        accommodation:
                          properties:
                            type:
                              const: room
                            change:
                              $ref: '#/components/schemas/preview_roomChange'
                example:
                  order: '6520081014'
                  modification:
                    accommodation:
                      reservation: '6187285715'
                      type: room
                      change:
                        room_reservation: '9876543210'
                        allocation:
                          number_of_adults: 2
                        guests:
                        - name: John Doe
                        - name: Jane Doe
                        smoking_preference: non_smoking
              - title: Preview accommodation payment modification
                description: Preview a change to the payment card details for an order.
                $ref: '#/components/schemas/paymentModificationPreviewInput'
                example:
                  order: '6520081014'
                  modification:
                    payment:
                      type: card
                      change:
                        cardholder: John Doe
                        number: '4111111111111111'
                        expiry_date: 2027-12
                        cvc: '123'
      responses:
        '200':
          description: Successful modification preview response.
          content:
            application/json:
              schema:
                oneOf:
                - title: Accommodation modification preview response
                  $ref: '#/components/schemas/accommodationModificationPreviewOutput'
                - title: Payment modification preview response
                  $ref: '#/components/schemas/paymentModificationPreviewOutput'
        '400':
          description: The request is invalid or missing required parameters. Refer to the [Error handling section](/demand/docs/support/error-handling/about-errors) for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
        '500':
          description: Internal server error. Try again later or contact support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
