                                                    type: number
                                                    format: double
                                                    multipleOf: 0.01
                                                    exclusiveMinimum: 0
                                                  booker_currency:
                                                    type: number
                                                    format: double
                                                    multipleOf: 0.01
                                                    exclusiveMinimum: 0
                                        non_conditional:
