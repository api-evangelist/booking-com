          $ref: '#/components/schemas/displayPriceV32'
        total:
          $ref: '#/components/schemas/totalPriceV32'
    cancelOutput:
      title: Cancellation response
      description: Response confirming whether the cancellation was completed or accepted for asynchronous processing.
      type: object
      properties:
        request_id:
          $ref: '#/components/schemas/requestId'
        data:
          title: Cancellation result
          description: The cancellation result. Accommodation cancellations may return `successful`. Car rental and car insurance cancellations may return `processing` while the request is completed asynchronously.
          oneOf:
          - title: Accommodation cancellation response
            description: Returned for accommodation cancellations. The reservation has already been cancelled successfully. If the cancellation cannot be completed, the API returns an error response.
            type: object
            properties:
              status:
                type: string
                const: successful
            required:
            - status
            example:
              status: successful
          - title: Car rental or car insurance cancellation response
            description: Returned for car rental and car insurance cancellations. The cancellation request has been accepted and is processed asynchronously. Retrieve the latest car order details using /orders/details/cars/live (Beta) to confirm that the reservation or insurance policy has been cancelled. If the request cannot be processed, the API returns an error response instead.
            type: object
            properties:
              status:
                type: string
                const: processing
            required:
            - status
            example:
              status: processing
