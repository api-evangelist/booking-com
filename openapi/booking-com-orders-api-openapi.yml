          description: "Overall order status. The returned values depend on the travel service associated with the order: \n\n- **Accommodation:** `booked`, `cancelled`, `cancelled_by_guest`, `cancelled_by_accommodation`, `stayed` and `no_show`. \n- **Cars** and **Attractions**: `booked` and `cancelled`.\n- **Flights**: `booked`, `cancelled` and `no_show`.\n- **Transfers**: `booked`, `cancelled` and `unknown`. \n\nFor transfer orders containing multiple legs, `unknown` indicates that the individual legs have different statuses. Inspect `taxis[].status` to determine the status of each leg."
          $ref: '#/components/schemas/orderStatusOutput'
        taxis:
          description: List of taxi legs included in this order. Each item represents a separate taxi leg (e.g., outbound and return trips).
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/taxiOutput'
        updated:
          $ref: '#/components/schemas/updatedOutput'
      oneOf:
      - title: Accommodation order
        properties:
          accommodations:
            type: object
          attractions:
            type: 'null'
          cars:
            type: 'null'
          flights:
            type: 'null'
          taxis:
            type: 'null'
        required:
        - accommodations
      - title: Attraction order
        properties:
          accommodations:
            type: 'null'
          attractions:
            type: object
          cars:
            type: 'null'
          flights:
            type: 'null'
          taxis:
            type: 'null'
        required:
        - attractions
      - title: Car rental order
        properties:
          accommodations:
            type: 'null'
          attractions:
            type: 'null'
          cars:
            type: object
          flights:
            type: 'null'
          taxis:
            type: 'null'
        required:
        - cars
      - title: Flight order
        properties:
          accommodations:
            type: 'null'
          attractions:
            type: 'null'
          cars:
            type: 'null'
          flights:
            type: object
          taxis:
            type: 'null'
        required:
        - flights
      - title: Taxi order
        properties:
          accommodations:
            type: 'null'
          attractions:
            type: 'null'
          cars:
            type: 'null'
          flights:
            type: 'null'
          taxis:
            type: array
        required:
        - taxis
