    cancelInput:
      title: Cancel a travel service
      description: Cancels a travel service within an existing order. Provide the reservation details for the travel service you want to cancel. Only one travel service can be cancelled per request.
      type: object
      properties:
        order:
          description: Unique identifier of the order containing the travel service to cancel.
          type: string
        accommodation:
          title: AccommodationOrdersCancelInput
          type: object
          properties:
            reservation:
              description: Unique identifier of the Accommodation order to cancel.
              type: string
            reason:
              description: Free-text explanation for the cancellation request.
              type: string
            request_property_approval:
              description: '**Deprecated.** For accommodation orders only. If a cancellation fee applies, you can request the accommodation to waive the fee and approve free cancellation. This is subject to accommodation approval.'
              type: boolean
              deprecated: true
          required:
          - reservation
          - reason
        car:
          title: CarsOrdersCancelInput
          type: object
          properties:
            reservation:
              description: Unique identifier of the car rental reservation to cancel.
              type: string
            reason:
              description: Free-text explanation for the cancellation request.
              type: string
            booker:
              description: Information about the person who made the booking. Required for car cancellations.
              type: object
              properties:
                country:
                  $ref: '#/components/schemas/countryId'
              required:
              - country
          required:
          - reservation
          - reason
          - booker
        insurance:
          title: InsuranceOrdersCancelInput
          description: Details of the insurance policy to cancel. Cancelling the insurance policy does not cancel the associated car rental reservation.
          type: object
          properties:
            car:
              title: CarsInsuranceOrdersCancelInput
              type: object
              properties:
                reservation:
                  description: Unique identifier of the car rental reservation associated with the insurance policy.
                  type: string
                policy_reference:
                  description: Unique identifier of the insurance policy to cancel.
                  type: string
                booker:
                  description: Information about the person who made the booking.
                  type: object
                  properties:
                    country:
                      $ref: '#/components/schemas/countryId'
                  required:
                  - country
              required:
              - reservation
              - policy_reference
              - booker
          required:
          - car
      oneOf:
      - title: Cancel a car order
        description: Use this option to cancel a car rental reservation.
        example:
          car:
            reservation: '1234567890'
            reason: My travel plans have changed and I no longer need this car rental.
            booker:
              country: nl
        required:
        - car
      - title: Cancel an accommodation order
        description: Use this option to cancel an accommodation reservation.
        example:
          order: '509430129718799'
          accommodation:
            reservation: '1234567890'
            reason: My travel dates have changed and I need to book a different property.
        required:
        - accommodation
      - title: Cancel a car insurance policy
        description: Use this option to cancel an insurance policy without cancelling the associated car rental reservation.
        example:
          insurance:
            car:
              reservation: '1234567890'
              policy_reference: 38df45ff-a6fb-4e24-a1d2-66fc3af23d76
              booker:
                country: nl
        required:
        - insurance
