  /orders/details/flights:
    post:
      summary: Orders with flight details
      description: 'Use this endpoint to retrieve detailed information for one or more flight orders. - You can request car order details either by **order ID** or by **reservation ID**. - The response includes all relevant information for each order, such as booking and cancellation details, commission, pricing, and optional extras (for example, policies). Results are sorted by `bookingDate` in descending order, with the most recently booked orders listed first. It returns structured order data, including pricing, itinerary segments with IATA airport codes, etc.


        This endpoint is ideal for:


        - Displaying flight booking details in traveller dashboards or confirmation pages.

        - Generating post-booking communications and invoices.

        - Performing reporting or reconciliation tasks that require accurate itinerary and pricing data.'
      operationId: /orders/details/flights
      parameters:
      - in: header
        name: X-Affiliate-Id
        schema:
          type: integer
        required: true
        description: Include here your Affiliate identifier number
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              title: FlightsDetailsInput
              type: object
              properties:
                currency:
                  description: A three-letter code that uniquely identifies a monetary currency as defined by the ISO 4217 standard. The full list can be obtained by calling <a href="/demand/docs/open-api/demand-api/commonpayments/common/payments/currencies" target="_blank">common/payments/currencies</a>.
                  type: string
                  pattern: ^[A-Z]{3}$
                  example: EUR
              oneOf:
              - title: FlightsDetailsInputByOrders
                properties:
                  orders:
                    description: List of order IDs for which details should be returned. Mutually exclusive with 'reservations'.
                    type: array
                    items:
                      type: string
                      description: Flight order id for which details have to be returned.
                    maxItems: 100
                required:
                - orders
                example:
                  currency: EUR
                  orders:
                  - '1234567890123456'
                  - '9876543210987654'
              - title: FlightsDetailsInputByReservations
                properties:
                  reservations:
                    description: List of reservation IDs for which details should be returned. Mutually exclusive with 'orders'.
                    type: array
                    items:
                      type: string
                      description: Flight reservation id for which details have to be returned.
                    maxItems: 100
                required:
                - reservations
                example:
                  currency: EUR
                  reservations:
                  - '2321873123'
                  - '4666773123'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                title: OrdersDetailsFlightsOutput
                type: object
                properties:
                  data:
                    type: array
                    items:
                      title: FlightsOutput
                      type: object
                      properties:
                        id:
                          description: Order id
                          type: string
                        reservation:
                          description: This is the reservation id for the travel service in this order.
                          type: string
                        currency:
                          title: CurrencyOutput
                          type: object
                          properties:
                            booker_currency:
                              description: The currency of the booker.
                              type: string
                            order_currency:
                              description: The currency in which the order was created.
                              type: string
                        itineraries:
                          type: array
                          items:
                            title: ItineraryOutput
                            type: object
                            properties:
                              arrival:
                                description: Arrival itinerary.
                                title: ItineraryPoint
                                type: object
                                properties:
                                  airport:
                                    description: A three-letter code that uniquely identifies an airport as defined by the International Air Transport Association (IATA). The full list can be obtained by calling  [common/locations/airports](#/common/locations/airports).
                                    pattern: ^[A-Z]{3}$
                                    type: string
                                  date_time:
                                    description: Date time of the itinerary.
                                    type: string
                                    format: date-time
                              departure:
                                description: Departure itinerary.
                                title: ItineraryPoint
                                type: object
                                properties:
                                  airport:
                                    description: A three-letter code that uniquely identifies an airport as defined by the International Air Transport Association (IATA). The full list can be obtained by calling  [common/locations/airports](#/common/locations/airports).
                                    pattern: ^[A-Z]{3}$
                                    type: string
                                  date_time:
                                    description: Date time of the itinerary.
                                    type: string
                                    format: date-time
                        label:
                          description: Identifier associated with the order.
                          type: string
                        price:
                          title: PriceOutput
                          type: object
                          properties:
                            booker_currency:
                              description: The price in the currency of the booker
                              type: number
                              format: double
                            order_currency:
                              description: The price in the currency in which order was created
                              type: number
                              format: double
                        status:
                          type: string
                          enum:
                          - booked
                          - cancelled
                          - unknown
                  request_id:
                    description: Uniquely identifies the request. Please provide this identifier when contacting support.
                    type: string
              example:
                data:
                - id: ORDER_ID
                  reservation: RESERVATION_ID
                  currency:
                    booker: EUR
                    order: USD
                  itineraries:
                  - departure:
                      airport: CAI
                      date_time: '2024-03-01T07:00:00+00:00'
                    arrival:
                      airport: LXR
                      date_time: '2024-03-01T08:10:00+00:00'
                  label: SAMPLE LABEL
                  price:
                    order_currency: 212.86
                    booker_currency: 197.87
                  status: booked
    servers:
    - url: https://demandapi.booking.com/3.1
      description: Production environment
    - url: https://demandapi-sandbox.booking.com/3.1
      description: Sandbox environment
  /orders/modify:
    post:
      summary: Modify an order
      description: 'Use this endpoint to modify certain aspects of an accommodation order, such as credit card details, checkin/checkout dates, and room configurations (guest allocation, guest names, and smoking preferences).

        - See the Orders modification guide for examples and best practices.'
      operationId: /orders/modify
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - title: AccommodationModification
                type: object
                properties:
                  order:
                    type: string
                    description: Order ID to be modified
                  modification:
                    type: object
                    properties:
                      accommodation:
                        type: object
                        properties:
                          reservation:
                            type: integer
                            description: Reservation ID
                          change:
                            oneOf:
                            - title: DateChange
                              type: object
                              properties:
                                checkin:
                                  type: string
                                  format: date
                                  description: New checkin date
                                checkout:
                                  type: string
                                  format: date
                                  description: New checkout date
                              required:
                              - checkin
                              - checkout
                            - title: RoomChange
                              type: object
                              properties:
                                room_reservation:
                                  type: integer
                                  format: int64
                                  description: Room reservation ID
                                allocation:
                                  type: object
                                  properties:
                                    number_of_adults:
                                      type: integer
                                guests:
                                  description: Guest information for the room.
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      name:
                                        type: string
                                smoking_preference:
                                  type: string
                                  enum:
                                  - no_preference
                                  - non_smoking
                                  - smoking
                          type:
                            description: Type of the accommodation change
                            type: string
                            enum:
                            - dates
                            - room
                        required:
                        - reservation
                        - type
                        - change
                    required:
                    - accommodation
                required:
                - order
                - modification
              - title: PaymentModification
                type: object
                properties:
                  order:
                    type: string
                    description: Order ID to be modified
                  modification:
                    type: object
                    properties:
                      payment:
                        type: object
                        properties:
                          change:
                            type: object
                            properties:
                              cardholder:
                                type: string
                                description: Cardholder name
                              cvc:
                                type: string
                                description: A 3 or 4 digit Card Verification Code (CVC) associated with the used card
                              expiry_date:
                                type: string
                                format: YYYY-MM
                                description: Card expiry date
                              number:
                                type: string
                                description: Card number
                            required:
                            - cardholder
                            - cvc
                            - expiry_date
                            - number
                          type:
                            description: Type of the payment change
                            type: string
                            enum:
                            - card
                        required:
                        - type
                        - change
                    required:
                    - payment
                required:
                - order
                - modification
      responses:
        '200':
          description: Successful modification
          content:
            application/json:
              schema:
                oneOf:
                - title: AccommodationModificationResponse
                  type: object
                  properties:
                    modification:
                      type: object
                      properties:
                        accommodation:
                          type: object
                          properties:
                            new_price:
                              description: New price to be paid after the modification
                              type: number
                              format: double
                            status:
                              description: Status for this modification request.
                              type: string
                              enum:
                              - successful
                              - failed
                - title: PaymentModificationResponse
                  type: object
                  properties:
                    modifications:
                      type: object
                      properties:
                        payment:
                          type: object
                          properties:
                            status:
                              description: Status for this modification request.
                              type: string
                              enum:
                              - successful
                              - failed
    servers:
    - url: https://demandapi.booking.com/3.1
      description: Production environment
    - url: https://demandapi-sandbox.booking.com/3.1
      description: Sandbox environment
  /orders/cancel:
    post:
      summary: Cancel an order
      description: Use this endpoint to process an order cancellation. Refer to the Cancellations guide for instructions, tips and examples.
      operationId: /orders/cancel
      parameters:
      - $ref: '#/components/parameters/AffiliateIdHeader'
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              title: OrdersCancelInput
              type: object
              properties:
                order:
                  description: ID of the order to cancel.
                  type: string
                reason:
                  description: The reason for cancelling this order.
                  type: string
