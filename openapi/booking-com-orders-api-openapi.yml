                                                  booker_currency:
                                                    type: number
                                                    format: double
                                                    multipleOf: 0.01
                                                    exclusiveMinimum: 0
                                              unit_amount:
                                                description: The price per unit for this charge. Only applicable when 'mode' is 'per_day', 'per_night', 'per_person_per_day', 'per_person_per_night', or 'per_person_per_stay'.
                                                nullable: true
