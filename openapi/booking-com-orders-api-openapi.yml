    create_beta_input:
      title: Create an order request
      description: Request payload for creating an order. Select the option that matches the travel service and payment requirements returned by the relevant search, availability or preview response.
      oneOf:
      - title: Create an accommodation order
        description: Use this object to create an accommodation order. Include accommodation details, booker details, an order token and the payment information required by the order.
        example:
          accommodation:
            label: Sample label
            products:
            - id: '333'
              bed_configuration: '123456'
              guests:
              - email: john.doe@booking.com
                name: John Doe
            remarks:
              estimated_arrival_time:
                hour: 12
              special_requests: We will need an extra cot.
          booker:
            address:
              address_line: Road-1, house-2
              city: Amsterdam
              country: nl
              post_code: '11111'
            company: Booking B.V
            email: john.doe@booking.com
            language: en-gb
            name:
              first_name: John
              last_name: Doe
            telephone: '12345678'
          order_token: sample-token
          payment:
            card:
              cardholder: John Doe
              cvc: '111'
              expiry_date: 2030-10
              number: '23333333333333'
            include_receipt: true
            method: card
            timing: pay_online_now
        type: object
        properties:
          accommodation:
            $ref: '#/components/schemas/accommodation'
          booker:
            $ref: '#/components/schemas/accommodation_booker'
          order_token:
            description: Token returned by /orders/preview containing the data required to create the order.
            type: string
          payment:
            allOf:
            - $ref: '#/components/schemas/create-beta_payment'
            - required:
              - timing
        required:
        - accommodation
        - booker
        - order_token
        - payment
      - title: Create a car rental order with payment
        description: Create a car rental order when the selected offer requires payment details.
        example:
          car:
            driver:
              email: john.doe@booking.com
              first_name: John
              last_name: Doe
              telephone: '12345678'
              title: Mr
          booker:
            address:
              address_line: Road-1, house-2
              city: Amsterdam
              country: nl
              post_code: '11111'
            company: Booking B.V
            email: john.doe@booking.com
            language: en-gb
            name:
              first_name: John
              last_name: Doe
            telephone: '12345678'
          order_token: sample-token
          payment:
            card:
              cardholder: John Doe
              cvc: '111'
              expiry_date: 2030-10
              number: '23333333333333'
            include_receipt: false
            method: card
            timing: pay_at_pickup
        allOf:
        - $ref: '#/components/schemas/car_create_beta_input'
        - required:
          - payment
      - title: Create a cardless car rental order
        description: Create a cardless car rental order only when the selected offer is payable at pickup, returns `credit_card_required=false` and has no online payable component. Do not determine this flow from `payment.timing` alone.
        example:
          car:
            driver:
              email: john.doe@booking.com
              first_name: John
              last_name: Doe
              telephone: '12345678'
              title: Mr
          booker:
            company: Booking B.V
            email: john.doe@booking.com
            language: en-gb
            name:
              first_name: John
              last_name: Doe
            telephone: '12345678'
          order_token: sample-token
        allOf:
        - $ref: '#/components/schemas/car_create_beta_input'
        - properties:
            payment: false
