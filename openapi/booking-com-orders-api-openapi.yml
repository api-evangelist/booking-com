      description: Monetary amount with currency for insurance prices.
      type:
      - object
      - 'null'
      properties:
        value:
          description: The monetary value.
          type:
          - number
          - 'null'
          format: double
        currency:
          description: The ISO 4217 currency code (e.g., 'EUR', 'USD').
          type:
          - string
          - 'null'
    preview_allocation:
      title: OrdersPreviewAccommodationAllocationOutput
