openapi: 3.2.0
info:
  title: Booking Com Manage bathrooms API
  version: '1.0'
  contact:
    name: Connectivity Team
    url: https://connect.booking.com
    email: connectivity@booking.com
  description: 'Operations tagged Manage bathrooms across 2 of this provider''s published API definitions: booking-com-facilities-api-openapi.yml, booking-com-facilities-api-remote-sync-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://supply-xml.booking.com/
  description: Test using live endpoint
- url: https://supply-xml.booking.com/facilities-api/
tags:
- name: Manage bathrooms
  description: 'Use the GET and the PUT endpoints to:


    Retrieve room bathroom configuration


    Add, modify or delete room-level bathroom information'
paths:
  /facilities-api/properties/{propertyId}/rooms/{roomId}/bathrooms:
    get:
      tags:
      - Manage bathrooms
      summary: Retrieve room bathroom configuration
      description: Retrieve room bathroom configuration. Bathroom attached to rooms.
      operationId: getBathroomDetails
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: integer
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBathroomDetails'
    put:
      tags:
      - Manage bathrooms
      summary: Manage bathrooms
      description: 'Add, modify or delete room-level bathroom information.


        **Important — overlay semantics:** This endpoint uses full-replace mode. Any bathroom definition absent from the request body is permanently deleted. Before updating existing bathroom configuration, call `GET /facilities-api/properties/{propertyId}/rooms/{roomId}/bathrooms` to retrieve the current state, then include all existing bathroom entries in your PUT body alongside any changes.'
      operationId: setBathroomDetails
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: integer
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BathroomDetailsRequest'
            examples:
              Enable hotel group bathrooms:
                description: Enable hotel group bathrooms
                value:
                  hotel_bathroom_details:
                    shared_bathroom_state: PRESENT
                    private_bathroom_state: PRESENT
                    number_of_bathrooms: 3
              Add hotel group bathroom details:
                description: Add hotel group bathroom details
                value:
                  hotel_bathroom_details:
                    shared_bathroom_state: MISSING
                    private_bathroom_state: PRESENT
                    private_bathroom_details:
                      type: EXTERNAL_BATHROOM
                      location_type: OTHER
                      location_other: outside of the room
                    number_of_bathrooms: 2
              Add homes group bathroom details:
                description: Add homes group bathroom details
                value:
                  property_bathroom_details:
                    bathrooms:
                    - bathroom_type: PRIVATE
                    - bathroom_type: SHARED
              Add homes group bathroom details with location:
                description: Add homes group bathroom details with location
                value:
                  property_bathroom_details:
                    bathrooms:
                    - bathroom_type: PRIVATE
                      bathroom_location: ENSUITE
                    - bathroom_type: SHARED
                      bathroom_location: OPPOSITE_THE_ROOM
              Add hostel bathroom details:
                description: Add hostel bathroom details
                value:
                  property_bathroom_details:
                    bathrooms:
                    - bathroom_type: PRIVATE
                      bathroom_location: DOWN_THE_HALL
                      hostel_bathroom_details:
                        bathroom_facilities:
                        - type: SHOWER
                          count: 98
                        - type: TOILET
                          count: 21
                        - type: SINK
                          count: 68
                        - type: BATH
                          count: 16
                        - type: TOILET_PAPER
                        - type: HAIR_DRYER
                        - type: SLIPPERS
                          is_paid: true
                        - type: BIDET
                        - type: TOOTHBRUSH
                          is_paid: true
                        - type: SHAMPOO
                          is_paid: false
                        - type: CONDITIONER
                          is_paid: false
                        - type: BODY_SOAP
                          is_paid: true
                        - type: TOWEL
                          is_paid: false
                        - type: HOT_WATER
                    - bathroom_type: SHARED
                      bathroom_location: DOWN_THE_HALL
                      hostel_bathroom_details:
                        gender: MIXED
                        num_guests_with_access_type: NUMBER_LESS_THAN_5
                        bathroom_facilities:
                        - type: SHOWER
                          count: 98
                        - type: TOILET
                          count: 21
                        - type: SINK
                          count: 68
                        - type: BATH
                          count: 16
                        - type: TOILET_PAPER
                        - type: HAIR_DRYER
                        - type: SLIPPERS
                          is_paid: true
                        - type: BIDET
                        - type: TOOTHBRUSH
                          is_paid: true
                        - type: SHAMPOO
                          is_paid: false
                        - type: CONDITIONER
                          is_paid: false
                        - type: BODY_SOAP
                          is_paid: true
                        - type: TOWEL
                          is_paid: true
                        - type: HOT_WATER
              Disable hotel group bathroom details:
                description: Disable hotel group bathroom details
                value:
                  hotel_bathroom_details:
                    shared_bathroom_state: MISSING
                    private_bathroom_state: MISSING
                    number_of_bathrooms: 0
              Remove bathroom details for homes and hostel group:
                description: Remove bathroom details for homes and hostel group
                value:
                  property_bathroom_details:
                    bathrooms: []
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '400':
          description: 'Invalid request payload. The `errors` array contains one or more entries with `code: 320`. The `details.fields` path identifies the exact field that failed validation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccessObject'
              examples:
                Hostel private bathroom limit exceeded:
                  description: A hostel property cannot have more than 1 private bathroom.
                  value:
                    warnings: []
                    errors:
                    - message: Invalid value
                      code: 320
                      details:
                        fields:
                        - property_bathroom_details.bathrooms
                      description: Hostel properties support a maximum of 1 private bathroom and 5 shared bathrooms.
                    meta:
                      ruid: X-RUID-EXAMPLE
                Shared hostel bathroom missing required fields:
                  description: A SHARED hostel bathroom must include `gender` and `num_guests_with_access_type`.
                  value:
                    warnings: []
                    errors:
                    - message: Invalid value
                      code: 320
                      details:
                        fields:
                        - property_bathroom_details.bathrooms[0].hostel_bathroom_details.gender
                      description: must not be null
                    meta:
                      ruid: X-RUID-EXAMPLE
                Hotel bathroom state and count inconsistency:
                  description: Both `private_bathroom_state` and `shared_bathroom_state` are MISSING but `number_of_bathrooms` is greater than 0.
                  value:
                    warnings: []
                    errors:
                    - message: Invalid value
                      code: 320
                      details:
                        fields:
                        - hotel_bathroom_details.number_of_bathrooms
                      description: number_of_bathrooms must be 0 when both private_bathroom_state and shared_bathroom_state are MISSING
                    meta:
                      ruid: X-RUID-EXAMPLE
    servers:
    - url: https://supply-xml.booking.com/
      description: Test using live endpoint
