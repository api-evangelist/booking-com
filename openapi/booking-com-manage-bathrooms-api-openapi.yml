components:
  schemas:
    HotelBathroomDetailsResponse:
      type: object
      description: Bathroom details for hotel-group properties.
      properties:
        private_bathroom_state:
          type: string
          enum:
          - MISSING
          - PRESENT
        shared_bathroom_state:
          type: string
          enum:
          - MISSING
          - PRESENT
        private_bathroom_details:
          $ref: '#/components/schemas/PrivateBathroomDetails'
        number_of_bathrooms:
          maximum: 20
          minimum: 0
          type: integer
          format: int32
    ApiResponseSuccess:
      type: object
      description: Successful response with empty warnings and errors
      properties:
        data:
          $ref: '#/components/schemas/SuccessObject'
        warnings:
          type: array
          maxItems: 0
        errors:
          type: array
          maxItems: 0
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    BathroomDetailsRequest:
      type: object
      properties:
        property_bathroom_details:
          $ref: '#/components/schemas/PropertyBathroomDetailsRequest'
        hotel_bathroom_details:
          $ref: '#/components/schemas/HotelBathroomDetailsRequest'
    ApiError:
      type: object
      properties:
        message:
          type: string
        code:
          type: integer
          description: Error code
        description:
          type: string
          description: Detailed error description
        details:
          type: object
          description: Additional error context
    HostelBathroomDetailsResponse:
      type: object
      description: 'Bathroom details for hostel-group properties. Property-level limits apply: maximum 1 private bathroom and 5 shared bathrooms per property.'
      properties:
        gender:
          type: string
          enum:
          - FEMALE
          - MALE
          - MIXED
        num_guests_with_access_type:
          type: string
          enum:
          - NUMBER_LESS_THAN_5
          - NUMBER_5_TO_10
          - NUMBER_11_TO_20
          - NUMBER_21_TO_30
          - NUMBER_31_TO_40
          - NUMBER_41_TO_50
          - NUMBER_MORE_THAN_50
        bathroom_facilities:
          type: array
          items:
            $ref: '#/components/schemas/HostelBathroomFacilityResponse'
    PropertyBathroomDetailsResponse:
      type: object
      properties:
        bathrooms:
          maxItems: 20
          minItems: 0
          type: array
          items:
            $ref: '#/components/schemas/BathroomResponse'
    HostelBathroomDetailsRequest:
      required:
      - bathroom_facilities
      type: object
      description: 'Bathroom details for hostel-group properties. Property-level limits apply: maximum 1 private bathroom and 5 shared bathrooms per property. Rules for `gender` and `num_guests_with_access_type` differ by `bathroom_type`: required for SHARED bathrooms, prohibited for PRIVATE bathrooms.'
      properties:
        gender:
          type: string
          description: Gender access for this shared bathroom. Required when `bathroom_type` is SHARED. Must not be provided when `bathroom_type` is PRIVATE.
          enum:
          - FEMALE
          - MALE
          - MIXED
        num_guests_with_access_type:
          type: string
          description: Approximate number of guests with access to this shared bathroom. Required when `bathroom_type` is SHARED. Must not be provided when `bathroom_type` is PRIVATE.
          enum:
          - NUMBER_LESS_THAN_5
          - NUMBER_5_TO_10
          - NUMBER_11_TO_20
          - NUMBER_21_TO_30
          - NUMBER_31_TO_40
          - NUMBER_41_TO_50
          - NUMBER_MORE_THAN_50
        bathroom_facilities:
          type: array
          description: 'List of facilities in this bathroom. Must include at least one of: SHOWER, TOILET, SINK, BATH.'
          minItems: 1
          items:
            $ref: '#/components/schemas/HostelBathroomFacilityRequest'
    HotelBathroomDetailsRequest:
      required:
      - number_of_bathrooms
      - private_bathroom_state
      - shared_bathroom_state
      type: object
      description: 'Bathroom details for hotel-group properties. Consistency rules: if both `private_bathroom_state` and `shared_bathroom_state` are MISSING, `number_of_bathrooms` must be 0. If either state is PRESENT, `number_of_bathrooms` must be greater than 0.'
      properties:
        private_bathroom_state:
          type: string
          description: Whether the property has private bathrooms. If PRESENT, `number_of_bathrooms` must be greater than 0.
          enum:
          - MISSING
          - PRESENT
        shared_bathroom_state:
          type: string
          description: Whether the property has shared bathrooms. If PRESENT, `number_of_bathrooms` must be greater than 0.
          enum:
          - MISSING
          - PRESENT
        private_bathroom_details:
          $ref: '#/components/schemas/PrivateBathroomDetails'
        number_of_bathrooms:
          maximum: 20
          minimum: 0
          type: integer
          format: int32
          description: Total number of bathrooms (private + shared combined). Must be 0 if both states are MISSING. Must be greater than 0 if either state is PRESENT.
    BathroomRequest:
      required:
      - bathroom_type
      type: object
      properties:
        id:
          type: integer
          format: int32
        bathroom_type:
          type: string
          enum:
          - PRIVATE
          - SHARED
        bathroom_location:
          type: string
          description: 'Location of the bathroom relative to the room. The set of allowed values differs by unit type — call `GET /facilities-api/meta` and inspect `bathroom_configurations[*].allowed_options` for the applicable `unit_type_id`. Submitting a location not in the allowed list for your unit type returns a 400 error. Note: BED_IN_DORMITORY (unit_type_id 26) does not allow a location for private bathrooms.'
          enum:
          - ENSUITE
          - NEXT_DOOR
          - DOWN_THE_HALL
          - OPPOSITE_THE_ROOM
          - IN_THE_HALLWAY
          - OTHER
          - INSIDE_THE_UNIT
        hostel_bathroom_details:
          $ref: '#/components/schemas/HostelBathroomDetailsRequest'
    BathroomDetailsResponse:
      type: object
      properties:
        property_bathroom_details:
          $ref: '#/components/schemas/PropertyBathroomDetailsResponse'
        hotel_bathroom_details:
          $ref: '#/components/schemas/HotelBathroomDetailsResponse'
    PropertyBathroomDetailsRequest:
      required:
      - bathrooms
      type: object
      properties:
        bathrooms:
          maxItems: 20
          minItems: 0
          type: array
          items:
            $ref: '#/components/schemas/BathroomRequest'
    HostelBathroomFacilityResponse:
      type: object
      properties:
        type:
          type: string
          enum:
          - SHOWER
          - TOILET
          - SINK
          - BATH
          - TOILET_PAPER
          - HAIR_DRYER
          - SLIPPERS
          - BIDET
          - TOOTHBRUSH
          - SHAMPOO
          - CONDITIONER
          - BODY_SOAP
          - TOWEL
          - HOT_WATER
        count:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
        is_paid:
          type: boolean
    ApiResponseSuccessObject:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/SuccessObject'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    BathroomResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        bathroom_type:
          type: string
          enum:
          - PRIVATE
          - SHARED
        bathroom_location:
          type: string
          enum:
          - ENSUITE
          - NEXT_DOOR
          - DOWN_THE_HALL
          - OPPOSITE_THE_ROOM
          - IN_THE_HALLWAY
          - OTHER
          - INSIDE_THE_UNIT
        hostel_bathroom_details:
          $ref: '#/components/schemas/HostelBathroomDetailsResponse'
    HostelBathroomFacilityRequest:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          enum:
          - SHOWER
          - TOILET
          - SINK
          - BATH
          - TOILET_PAPER
          - HAIR_DRYER
          - SLIPPERS
          - BIDET
          - TOOTHBRUSH
          - SHAMPOO
          - CONDITIONER
          - BODY_SOAP
          - TOWEL
          - HOT_WATER
        count:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          description: Number of units of this facility. Only applicable to SHOWER, TOILET, SINK, and BATH. Must not be provided for other facility types.
        is_paid:
          type: boolean
          description: Whether guests are charged for this amenity. Only applicable to SLIPPERS, TOOTHBRUSH, SHAMPOO, CONDITIONER, BODY_SOAP, and TOWEL. Must not be provided for other facility types.
    SuccessObject:
      type: object
      properties:
        success:
          type: boolean
    ApiResponseBathroomDetails:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BathroomDetailsResponse'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    PrivateBathroomDetails:
      type: object
      properties:
        type:
          type: string
          enum:
          - DEFAULT
          - EXTERNAL_BATHROOM
          - ATTACHED_BATHROOM
        location_type:
          type: string
          enum:
          - DEFAULT
          - NEXT_DOOR
          - DOWN_THE_HALL
          - ACROSS_FROM_THE_ROOM
          - IN_THE_LOBBY
          - OTHER
        location_other:
          type: string
    ResponseMeta:
      type: object
      properties:
        ruid:
          type: string
    PropertyBathroomDetails:
      properties:
        bathrooms:
          type: array
          items:
            $ref: '#/components/schemas/Bathroom'
          maxItems: 20
          minItems: 0
      required:
      - bathrooms
    BathroomDetails:
      properties:
        property_bathroom_details:
          $ref: '#/components/schemas/PropertyBathroomDetails'
        hotel_bathroom_details:
          $ref: '#/components/schemas/HotelBathroomDetails'
    HostelBathroomDetails:
      properties:
        gender:
          type: string
          enum:
          - FEMALE
          - MALE
          - MIXED
        num_guests_with_access_type:
          type: string
          enum:
          - NUMBER_LESS_THAN_5
          - NUMBER_5_TO_10
          - NUMBER_11_TO_20
          - NUMBER_21_TO_30
          - NUMBER_31_TO_40
          - NUMBER_41_TO_50
          - NUMBER_MORE_THAN_50
        bathroom_facilities:
          type: array
          items:
            $ref: '#/components/schemas/HostelBathroomFacility'
          minItems: 1
      required:
      - bathroom_facilities
    SuccessObject_2:
      properties:
        success:
          type: boolean
    ApiResponseSuccessObject_2:
      properties:
        ruid:
          type: string
          writeOnly: true
        data:
          $ref: '#/components/schemas/SuccessObject_2'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ApiError_2'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError_2'
        meta:
          $ref: '#/components/schemas/ResponseMeta_2'
    ApiResponseBathroomDetails_2:
      properties:
        ruid:
          type: string
          writeOnly: true
        data:
          $ref: '#/components/schemas/BathroomDetails'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ApiError_2'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError_2'
        meta:
          $ref: '#/components/schemas/ResponseMeta_2'
    PrivateBathroomDetails_2:
      properties:
        type:
          type: string
          enum:
          - DEFAULT
          - EXTERNAL_BATHROOM
          - ATTACHED_BATHROOM
        location_type:
          type: string
          enum:
          - DEFAULT
          - NEXT_DOOR
          - DOWN_THE_HALL
          - ACROSS_FROM_THE_ROOM
          - IN_THE_LOBBY
          - OTHER
        location_other:
          type: string
    ApiError_2:
      properties:
        message:
          type: string
        code:
          type: string
        details:
          type: object
    HostelBathroomFacility:
      properties:
        type:
          type: string
          enum:
          - SHOWER
          - TOILET
          - SINK
          - BATH
          - TOILET_PAPER
          - HAIR_DRYER
          - SLIPPERS
          - BIDET
          - TOOTHBRUSH
          - SHAMPOO
