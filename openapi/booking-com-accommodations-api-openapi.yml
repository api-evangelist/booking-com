    accommodationDetail_2:
      title: AccommodationsDetailsDataOutput
      description: All static information related to an accommodation property (excludes information on availability).
      type: object
      properties:
        id:
          $ref: '#/components/schemas/accommodationId'
        accommodation_status:
          description: 'Operational status of the accommodation. Note that closed accommodations are only included in the response when querying by accommodation ID (`accommodations`); requests by location (`airport`, `city`, `country`, or `region`) exclude closed accommodations, so those responses only contain accommodations with status `open`.


            - `open`: The accommodation is open and bookable.

            - `closed_fraud`: The accommodation is closed due to fraud or related trust and safety concerns. Only returned when fraud visibility is enabled for your account; otherwise such accommodations are reported as `closed_permanently`.

            - `closed_temporarily`: The accommodation is temporarily closed.

            - `closed_permanently`: The accommodation is permanently closed.'
          type: string
          enum:
          - open
          - closed_fraud
          - closed_temporarily
          - closed_permanently
