          $ref: '#/components/schemas/facilityDetails'
        fiscal_information:
          $ref: '#/components/schemas/fiscalInformation'
        is_genius:
          description: Whether the accommodation participates in the Genius programme.
          type: boolean
        key_collection_information:
          $ref: '#/components/schemas/keyCollectionInformation'
        location:
          $ref: '#/components/schemas/accommodationLocation_2'
        long_stay_friendly:
          description: Whether the accommodation is suitable for long stays.
          type: boolean
        meal_prices:
          $ref: '#/components/schemas/mealPrices'
        name:
          description: Translated name of the accommodation property.
          $ref: '#/components/schemas/translatedString'
