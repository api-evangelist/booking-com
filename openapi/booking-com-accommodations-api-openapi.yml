      properties:
        request_id:
          $ref: '#/components/schemas/requestId'
        data:
          type: array
          items:
            $ref: '#/components/schemas/availability'
    mealPrices:
      title: MealPrices
      description: Details regarding the meal pricing options offered at this accommodation.
      type: object
