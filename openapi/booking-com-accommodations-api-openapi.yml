          minimum: 1
        policies:
          $ref: '#/components/schemas/productPoliciesMultiCurrencyAvailability'
        price:
          $ref: '#/components/schemas/priceV32'
        room:
          $ref: '#/components/schemas/roomIdString'
    meal_plan_filter:
