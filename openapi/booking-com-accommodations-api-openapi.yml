        price:
          $ref: '#/components/schemas/recommendation_priceV32'
        products:
          description: ''
          type: array
          items:
            $ref: '#/components/schemas/productV32'
    reviewsScores_input:
      title: AccommodationsReviewsInput
      type: object
      properties:
        accommodations:
          type: array
