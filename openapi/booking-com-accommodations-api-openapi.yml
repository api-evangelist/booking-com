                    description: Ages to which this entry is applicable. Children are aged 0-17. 18/null means adult. The interval is inclusive.
                    type: object
                    properties:
                      from:
                        type: integer
                        minimum: 0
                        maximum: 18
                      to:
                        type:
                        - integer
                        - 'null'
                        minimum: 0
                        maximum: 18
                  mode:
                    description: How the price is applied per cot/extra bed.
                    type: string
                    enum:
                    - per_night
                    - per_stay
                  price:
