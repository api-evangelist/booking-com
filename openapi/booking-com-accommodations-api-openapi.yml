              items:
                type: integer
            permanently:
              type: array
              items:
                type: integer
            temporarily:
              type: array
              items:
                type: integer
        opened:
          description: Accommodations which have opened since the given timestamp. Note that sometimes accommodations may be closed again shortly after.
          type: array
          items:
            type: integer
