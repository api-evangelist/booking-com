          description: Approximate number of bookable rooms or accommodation units configured in the Booking.com system. This value is not an availability indicator and **does not necessarily represent the property's physical room count**. For holiday homes and similar private rentals, this may be 1 even when the property contains multiple bedrooms, because the entire property is offered as a single bookable unit.
