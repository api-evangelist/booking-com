        meals:
          description: The meals included in the meal plan.
          type: array
          items:
            type: string
            enum:
            - breakfast
            - dinner
            - lunch
        plan:
          description: The meal plan included in this product.
          type: string
          enum:
          - all_inclusive
          - breakfast_included
          - full_board
          - half_board
          - no_plan
    conditionId:
