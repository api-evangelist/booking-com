  /accommodations/third-party-suppliers:
    post:
      summary: Third-party suppliers
      description: 'Use this endpoint to retrieve the list of third-party suppliers that facilitate accommodation inventory on Booking.com.


        A third-party supplier is an external partner company that provides accommodation inventory through Booking.com. When a product is facilitated by a third-party supplier:


        * `inventory.third_party` is `true`.

        * `inventory.third_party_supplier_id` contains the supplier identifier.


        Use the returned `id` values to match the `inventory.third_party_supplier_id` returned by /accommodations/availability and retrieve supplier information, such as the supplier name and company address.


        Call this endpoint with an empty request body to retrieve the complete list of suppliers.'
      operationId: /accommodations/third-party-suppliers
      parameters:
      - $ref: '#/components/parameters/AffiliateIdHeader'
      tags:
      - Accommodations
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/thirdPartySuppliers_output'
              example:
                request_id: 01fr9ez700exycb98w90w5r9sh
                data:
                - id: 101
                  name: Example Supplier
                  company_address: 123 Example Street, 1000 Amsterdam, Netherlands
                - id: 102
                  name: Another Supplier
                  company_address: null
        '500':
          description: Internal server error. Try again later or contact support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              examples:
                internal_error:
                  summary: Generic server error
                  value:
                    request_id: 01kjan66dedrpbwv4m1966dzw3
                    errors:
                    - id: '500'
                      message: Internal server error. Try again later or contact support.
    servers:
    - url: https://demandapi.booking.com/3.2
      description: Production environment – use for live integrations.
    - url: https://demandapi-sandbox.booking.com/3.2
      description: Sandbox environment – use for testing and validation.
components:
  parameters:
    AffiliateIdHeader:
      in: header
      name: X-Affiliate-Id
      schema:
        type: integer
      required: true
      description: Include here your Affiliate identifier number
  schemas:
    availabilityInventoryOutput:
      title: AccommodationsAvailabilityInventoryOutput
      description: Inventory details for an accommodation product returned by `/accommodations/availability`.
      type: object
      properties:
        third_party:
          type: boolean
          description: Indicates whether the product is facilitated by a third-party supplier.
        third_party_supplier_id:
          description: Unique identifier of the third-party supplier that facilitates this product. Returned only for third-party inventory (when `third_party` is `true`). The field may be omitted if the supplier information is unavailable. Use the [/accommodations/third-party-suppliers](#/accommodations/third-party-suppliers) endpoint to retrieve supplier details.
          $ref: '#/components/schemas/thirdPartySupplierId'
        type:
          $ref: '#/components/schemas/inventoryOutputType'
    thirdPartySuppliers_output:
      title: AccommodationsThirdPartySuppliersOutput
      type: object
      properties:
        request_id:
          $ref: '#/components/schemas/requestId'
        data:
          description: List of third-party accommodation suppliers.
          type: array
          items:
            $ref: '#/components/schemas/thirdPartySupplier'
    coordinates:
      title: AccommodationsSearchCoordinatesOutput
      description: Limit the result list to the specified coordinates.
      type: object
      properties:
        latitude:
          description: Specify a latitude (as well as a longitude and radius) to do searches around a specific location.
          type: number
          format: double
        longitude:
          description: Specify a longitude (as well as a latitude and radius) to do searches around a specific location.
          type: number
          format: double
        radius:
          description: The radius is km to search around the specified latitude and longitude.
          type: number
          format: double
    smartSearchInput:
      title: AccommodationsSmartSearchInput
      type: object
      properties:
        airport:
          $ref: '#/components/schemas/airportId'
        booker:
          $ref: '#/components/schemas/booker'
        checkin:
          $ref: '#/components/schemas/checkin'
        checkout:
          $ref: '#/components/schemas/checkout'
        city:
          $ref: '#/components/schemas/cityId'
        coordinates:
          $ref: '#/components/schemas/coordinates'
        country:
          $ref: '#/components/schemas/countryId'
        currency:
          $ref: '#/components/schemas/currencyId'
        district:
          $ref: '#/components/schemas/districtId'
        extras:
          $ref: '#/components/schemas/extras'
        guests:
          $ref: '#/components/schemas/guests'
        landmark:
          $ref: '#/components/schemas/landmarkId'
        page:
          $ref: '#/components/schemas/page'
        region:
          $ref: '#/components/schemas/regionId'
        rows:
          $ref: '#/components/schemas/maximumResults'
        search_query:
          description: Natural language query describing the traveller’s accommodation preferences, intent, or desired experience. The query is interpreted semantically and may match accommodation features, amenities, location context, property types, traveller intent, or ranking signals.
          type: string
          minLength: 3
          maxLength: 300
        sort:
          description: Controls how accommodation results are ordered in the response.
          type: object
          properties:
            by:
              description: Primary sorting strategy applied to the search results. Use `distance` together with `coordinates` to rank accommodations by proximity.
              type: string
              enum:
              - distance
              - price
              - review_score
              - stars
            direction:
              description: Sort direction applied to the selected sorting strategy. Descending order is not supported when sorting by `distance`.
              type: string
              enum:
              - ascending
              - descending
      required:
      - booker
      - checkin
      - checkout
      - guests
      - search_query
    productId:
