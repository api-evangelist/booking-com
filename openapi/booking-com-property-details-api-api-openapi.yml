            [Current Documentation](/connectivity/docs/api-reference/addresses/)

            DataMapping: Addresses

            '
          items:
            $ref: '#/components/schemas/Translation'
        position:
          $ref: '#/components/schemas/Position'
        check_in:
          $ref: '#/components/schemas/TimeRange'
        check_out:
          $ref: '#/components/schemas/TimeRange'
        property_name:
