            Validation: One of [(PCT) Property Class Type Codes (OTA 2014B)](/connectivity/docs/codes-pct/).

            During creation, either property_category or booking_property_category are required.

            [Current Documentation](/connectivity/docs/api-reference/hotelcategory/)

            DataMapping: HotelCategory/Code

            '
          format: int32
        booking_property_category:
          type: integer
          description: 'The Booking.com code for property_category. Utilize the meta endpoint for valid values and their OTA mappings.

            Validation: During creation, either property_category or booking_property_category are required.

            '
