            [Current Documentation](/connectivity/docs/api-reference/hoteldescriptivecontent/)

            DataMapping: LanguageCode

            '
        languages_spoken:
          type: array
          description: 'The languages spoken by staff.

            Validation: One of [Booking.com Language Code](/connectivity/docs/codes-bcl/)

            DataMapping: HotelInfo->Languages

            '
          items:
            type: string
            description: 'The languages spoken by staff.

              Validation: One of [Booking.com Language Code](/connectivity/docs/codes-bcl/)

              DataMapping: HotelInfo->Languages

              '
        room_count:
          minimum: 0
          type: integer
          description: 'The number of sellable units the property offers.

            DataMapping: GuestRoomInfo->Quantity

            '
          format: int32
        floor_count:
          maximum: 200
          minimum: 0
          type: integer
          description: 'Total number of floors the building has (excl. underground floors).

            Validation: Max value of 200

            DataMapping: TotalNumberOfFloors->Number

            '
          format: int32
        provider_property_id:
          maxLength: 16
          minLength: 0
          type: string
          description: 'An external id to be associated with the property (e.g. the providers internal id)

            Validation: Maximum length of 16 characters

            DataMapping: HotelInfo-ID

            '
        currency_code:
          maxLength: 3
          minLength: 0
          type: string
          description: "Booking.com defines the currency for each property. In most cases this should not be passed as only one currency\n is allowed per country. Retrieve a list of all currency codes with /xml/currencies\nValidation: Must be allowed for property's country\n[Current Documentation](/connectivity/docs/api-reference/hoteldescriptivecontent/)\nData Mapping: currencyCode\n"
        stars:
          pattern: ^0(\.0)?|[1-4](\.[05])?|5(\.0)?$
          type: string
          description: 'The number of stars a property has.

            Validation: String with values 0 through 5, optionally may include half stars for values 1 or greater

            (i.e. 0, 1, 1.5, 2, 2.5 ... 4, 4.5, 5)

            Default: 0

            DataMapping: AffiliationInfo->Awards->Award

            '
        physical_address:
          $ref: '#/components/schemas/Address'
    ApiResponsePropertyInfoRead:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PropertyInfoRead'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ApiErrorOTA'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiErrorOTA'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ApiErrorOTA:
      type: object
      properties:
        message:
          type: string
        code:
          type: integer
          format: int32
        details:
          $ref: '#/components/schemas/ObjectNode'
        description:
          type: string
    PropertyInfoCreate:
      required:
      - check_in
      - legal_entity_id
      - physical_address
      - position
      - property_name
