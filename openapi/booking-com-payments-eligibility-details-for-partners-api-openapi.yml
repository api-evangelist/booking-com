                          decimals: 2
                        is_config_update_supported_by_api: true
                      - property_id: '55318472'
                        legal_entity_id: '1847293'
                        current_payout_configuration:
                          payin_collection_strategy: ALL
                          payout_method: BT
                          payout_frequency: MONTHLY
                          payout_netting: NET
                        payout_configuration_options:
                        - is_eligible: true
