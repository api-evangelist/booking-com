  /rooms-api/meta:
    get:
      tags:
      - meta
      summary: Get meta data for units
      description: "Retrieve meta data required for unit creation and update for any supported <code>language_code</code>\n\
        \    <ul>\n    <li>Retrieve the list of all unit type IDs allowed for creation/update. For each <code>$.unit_types[*]</code>\
        \ record you will find:</li>\n        <ul>\n        <li><code>unit_type_id</code>: the unit type ID you must provide\
        \ with each create and update request</li>\n        <li><code>unit_type_name</code>: string representation of unit\
        \ type ID (translatable)</li>\n        <li><code>is_multi_room</code>: attribute that defines what type of room types\
        \ you can use add in your unit</li>\n        <li><code>is_active</code>: attribute that defines if a unit type is\
        \ available for creation/update, inactive room types are available for read only</li>\n        <li><code>valid_property_categories</code>:\
        \ list of property categories that allow creation of this unit type</li>\n        <li><code>suggested_unit_names</code>:\
        \ list of unit names that we recommend to use in combination with this unit type</li>\n        </ul>\n    <li>Retrieve\
        \ the list of all room name IDs allowed during unit creation/update. For each <code>$.unit_names[*]</code> record\
        \ you will find:</li>\n        <ul>\n        <li><code>unit_name_id</code>: the unit name ID you must provide with\
        \ each create request</li>\n        <li><code>unit_name</code>: string representation of unit name ID (translatable)</li>\n\
        \        </ul>\n    <li>Retrieve the list of all bed type IDs allowed during unit creation/update. For each <code>$.bed_types[*]</code>\
        \ record you will find:</li>\n        <ul>\n        <li><code>bed_type_id</code>: the bed type ID you must provide\
        \ when configuring rooms</li>\n        <li><code>bed_type_name</code>: string representation of bed type (translatable)</li>\n\
        \        <li><code>bed_type_description</code>: description of bed type size using metric units (translatable)</li>\n\
        \        <li><code>bed_type_description_imperial</code>: description of bed type size using imperial units (translatable)</li>\n\
        \        <li><code>is_active</code>: attribute that defines if a bed type is available for creation/update, inactive\
        \ bed types are available for read only</li>\n        </ul>\n    <li>Retrieve the list of all property categories\
        \ for which you can create a unit. For each property type you will find its name and category ID, as well as an OTA\
        \ or a Booking.com extended code</li>\n    </ul>\n"
      operationId: getRoomMeta
      parameters:
      - name: language_code
        in: query
        description: Language code for localization. Defaults to <code>EN_GB</code>.
        required: false
        schema:
          type: string
          enum:
          - EN_GB
          - EN_US
          - DE
          - NL
          - FR
          - ES
          - ES_AR
          - ES_MX
          - CA
          - IT
          - PT_PT
          - PT_BR
          - 'NO'
          - FI
          - SV
          - DA
          - CS
          - HU
          - RO
          - JA
          - ZH_CN
          - ZH_TW
          - PL
          - EL
          - RU
          - TR
          - BG
          - AR
          - KA
          - KO
          - HE
          - LV
          - UK
          - ID
          - MS
          - TH
          - ET
          - HR
          - LT
          - SK
          - SR
          - SL
          - VI
          - TL
          - IS
          - HI
          - SQ
      - name: show_inactive
        in: query
        description: Show/hide inactive unit and bed types
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseUnitMeta'
components:
  schemas:
    BedConfigurationRequest:
      description: '<ul>

        <li>For multi-room unit you must add exactly one bed configuration</li>

        <li>For single-room unit you must add at least one bed configuration, others are optional</li>

        <li>Bed type ID provided must exist and be active in meta (see <code>$.bed_types[*].is_active</code>)</li>

        <li>Same bed type ID must be repeated within a single bed configuration</li>

        </ul>

        '
      properties:
        beds:
          type: array
          items:
            $ref: '#/components/schemas/BedRequest'
          minItems: 1
        is_default_configuration:
          type: boolean
          description: Exactly one default bed configuration is mandatory for each room provided
      required:
      - beds
      - is_default_configuration
    BedRequest:
      properties:
        bed_type_id:
          type: integer
          format: int32
        bed_count:
          type: integer
          format: int32
      required:
      - bed_count
      - bed_type_id
    BulkUnitsCreateRequest:
      description: Bulk unit create request
      properties:
        units:
          type: array
          description: List of units to create. All units must belong to the same property. Maximum 100 units per request.
          items:
            $ref: '#/components/schemas/UnitCreateRequest'
          maxItems: 100
          minItems: 1
      required:
      - units
    ConfigurationRequest:
      properties:
        unit_type_id:
          type: integer
          format: int32
          description: '<ul>

            <li>Must exist and be active in meta (see <code>$.unit_type[*].id</code> and <code>$.unit_type[*].is_active</code>)
            for unit creation/update</li>

            <li>Must be valid for property''s category in meta (see <code>$.unit_type[*].valid_property_categories</code>)</li>

            </ul>

            '
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomRequest'
          minItems: 1
      required:
      - rooms
      - unit_type_id
    ExtraBedsConfigurationCreateRequest:
      description: Extra bed & crib options
      properties:
        extra_beds:
          type: integer
          format: int32
          default: 0
          description: Number of extra beds you can provide
          maximum: 100
          minimum: 0
        cribs:
          type: integer
          format: int32
          default: 0
          description: Number of cribs you can provide
          maximum: 100
          minimum: 0
        is_crib_and_extra_bed_allowed:
          type: boolean
          default: false
          description: Both extra beds and cribs can be provided (<code>true</code>) or only one of the options (<code>false</code>)?
    OccupancyCreateRequest:
      deprecated: true
      properties:
        max_guests:
          type: integer
          format: int32
          default: 1
          description: Maximum number of guests
          maximum: 50
          minimum: 1
        max_adults:
          type: integer
          format: int32
          default: 1
          description: Maximum number of adults
          maximum: 50
          minimum: 1
        max_children:
          type: integer
          format: int32
          default: 0
          description: Maximum number of children (0-17 years old)
          maximum: 49
          minimum: 0
    OccupancyDetailsCreateRequest:
      description: Occupancy settings for the unit. Replaces the deprecated <code>occupancy</code> object.
      properties:
        max_guests:
          type: integer
          format: int32
          default: 1
          description: Maximum number of guests
          maximum: 50
          minimum: 1
        max_adults:
          type: integer
          format: int32
          default: 1
          description: Maximum number of adults
          maximum: 50
          minimum: 1
        max_children:
          type: integer
          format: int32
          default: 0
          description: Maximum number of children excluding infants (3-17 years old)
          maximum: 49
          minimum: 0
        max_infants:
          type: integer
          format: int32
          default: 0
          description: Maximum number of infants (0-2 years old). Infants are counted toward <code>max_guests</code>.
          maximum: 49
          minimum: 0
        max_infants_on_top:
          type: integer
          format: int32
          default: 0
          description: Maximum number of infants (0-2 years old) on top of maximum number of guests
          maximum: 49
          minimum: 0
    RoomRequest:
      properties:
        type:
          type: string
          description: '<ul>

            <li>For multi-room units you must add one or more <code>BEDROOM_SUBROOM</code> or <code>LIVING_ROOM_SUBROOM</code>,
            at least one of the rooms must have beds</li>

            <li>For single-room units you must add exactly one <code>GUEST_ROOM</code></li>

            </ul>

            '
          enum:
          - BEDROOM_SUBROOM
          - LIVING_ROOM_SUBROOM
          - GUEST_ROOM
        bed_configurations:
          type: array
          items:
            $ref: '#/components/schemas/BedConfigurationRequest'
      required:
      - type
    SizeRequest:
      properties:
        value:
          type: number
          format: double
          description: Must be a value between 1 and 9999.99
        unit:
          type: string
          description: SQM (square meters) or SQFT (square feet)
          enum:
          - SQM
          - SQFT
      required:
      - unit
      - value
    UnitCreateRequest:
      description: Unit create schema
      properties:
        property_id:
          type: integer
          format: int32
          description: Property ID the unit belongs to. All units in a single request must belong to the same property.
        correlation_id:
          type: string
          description: '<ul>

            <li>Correlation id to map the created unit in the response (see <code>$.units[i].correlation_id</code>)</li>

            <li>Must be unique for all provided units in the request</li>

            </ul>

            '
          minLength: 1
        configuration:
          $ref: '#/components/schemas/ConfigurationRequest'
        unit_name_id:
          type: integer
          format: int32
          description: '<ul>

            <li>The list of available unit names can be found in meta (see <code>$.unit_names</code>)</li>

            <li>Set <code>debug_info</code> as <code>true</code> to retrieve the generated unit name (see <code>$.unit_name_fallback</code>)</li>

            </ul>

            '
        unit_name_source:
          type: string
          description: " <ul>\n <li>PROVIDED uses the <code>unit_name_id</code> as the unit name source and <code>unit_name_id</code>\
            \ must be set when using PROVIDED</li>\n <li>GENERATED generates the <code>unit_name_id</code> and <code>unit_name_id</code>\
            \ must not be set when using GENERATED</li>\n </ul>\n"
          enum:
          - PROVIDED
          - GENERATED
        category_id:
          type: integer
          format: int32
          description: '<ul>

            <li>Category id for the unit</li>

            <li>Use meta to retrieve the supported categories (see <code>$.unit_categories</code>)</li>

            </ul>

            '
        number_of_units:
          type: integer
          format: int32
          default: 1
          description: Number of units must be between 0 and 32000
        smoking_policy:
          type: string
          default: SMOKING_AND_NONSMOKING
          enum:
          - SMOKING
          - NONSMOKING
          - SMOKING_AND_NONSMOKING
        size:
          $ref: '#/components/schemas/SizeRequest'
        partner_reference_name:
          type: string
          description: Internal room name, visible only in API and Extranet
        floor_numbers_located_on:
          type: array
          description: One or more floors where the unit is located; 0 is a ground floor
          items:
            type: integer
            format: int32
            description: One or more floors where the unit is located; 0 is a ground floor
        occupancy:
          $ref: '#/components/schemas/OccupancyCreateRequest'
        occupancy_details:
          $ref: '#/components/schemas/OccupancyDetailsCreateRequest'
        extra_beds_configuration:
          $ref: '#/components/schemas/ExtraBedsConfigurationCreateRequest'
      required:
      - configuration
      - correlation_id
      - property_id
    ApiError:
      properties:
        message:
          type: string
        code:
          type: integer
          format: int32
          description: ''
        details:
          type: object
          properties:
            fields:
              type: array
              description: ''
              items:
                type: string
        description:
          type: string
    ApiResponseBulkUnitsCreateResponse:
      properties:
        ruid:
          type: string
          writeOnly: true
        data:
          $ref: '#/components/schemas/BulkUnitsCreateResponse'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    Bed:
      properties:
        bed_type_id:
          type: integer
          format: int32
        bed_count:
          type: integer
          format: int32
      required:
      - bed_count
      - bed_type_id
    BulkUnitsCreateResponse:
      properties:
        units:
          type: array
          description: List of created units. Use <code>correlation_id</code> to map each entry back to the corresponding
            item in the request.
          items:
            $ref: '#/components/schemas/UnitCreateResponse'
    ResponseMeta:
      properties:
        ruid:
          type: string
    UnitCreateResponse:
      properties:
        unit_id:
          type: integer
          format: int64
          description: Id of the created unit
        correlation_id:
          type: string
          description: Correlation id provided in the create request to map the created unit back to the request
        property_id:
          type: integer
          format: int32
          description: Property ID the unit belongs to
        configuration:
          $ref: '#/components/schemas/UnitCreateResponseConfiguration'
        unit_name_id:
          type: integer
          format: int32
          description: Unit name ID assigned to this unit
        unit_name_source:
          type: string
          description: Indicates whether the unit name was explicitly provided (<code>PROVIDED</code>) or auto-generated (<code>GENERATED</code>)
          enum:
          - PROVIDED
          - GENERATED
        category_id:
          type: integer
          format: int32
          description: Category ID assigned to this unit
        number_of_units:
          type: integer
          format: int32
          description: Number of identical units of this type
        smoking_policy:
          type: string
          description: Smoking policy for this unit
          enum:
          - SMOKING
          - NONSMOKING
          - SMOKING_AND_NONSMOKING
        size:
          $ref: '#/components/schemas/UnitCreateResponseSize'
        partner_reference_name:
          type: string
        floor_numbers_located_on:
          type: array
          items:
            type: integer
            format: int32
        occupancy:
          $ref: '#/components/schemas/UnitCreateResponseOccupancy'
        occupancy_details:
          $ref: '#/components/schemas/UnitCreateResponseOccupancyDetails'
        extra_beds_configuration:
          $ref: '#/components/schemas/UnitCreateResponseExtraBedsConfiguration'
    UnitCreateResponseBedConfiguration:
      properties:
        beds:
          type: array
          items:
            $ref: '#/components/schemas/Bed'
        is_default_configuration:
          type: boolean
    UnitCreateResponseConfiguration:
      properties:
        unit_type_id:
          type: integer
          format: int32
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/UnitCreateResponseRoom'
    UnitCreateResponseExtraBedsConfiguration:
      properties:
        extra_beds:
          type: integer
          format: int32
        cribs:
          type: integer
          format: int32
        is_crib_and_extra_bed_allowed:
          type: boolean
    UnitCreateResponseOccupancy:
      deprecated: true
      properties:
        max_guests:
          type: integer
          format: int32
        max_adults:
          type: integer
          format: int32
        max_children:
          type: integer
          format: int32
    UnitCreateResponseOccupancyDetails:
      properties:
