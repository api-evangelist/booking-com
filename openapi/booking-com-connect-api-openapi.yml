        all_inclusive:
          type: boolean
          description: Boolean value set to "true" if the block mealplan is all inclusive or "false" if it is not.
        taxes:
          type: string
          description: Taxes that are included in the price for the block.
        number_of_rooms_left:
          type: integer
          format: int32
          description: The number of rooms left.
        max_children_free:
          type: integer
          format: int32
          description: The number of children that can stay free of charge
        max_adults:
          type: integer
          format: int32
          description: The maximum number of adults allowed to stay in this room for this price.
        room_type_id:
          type: integer
          format: int64
          description: Identifier for the type of this room. Displayed when extras=room_type_id is requested.
        smoking:
          type: integer
          format: int32
          description: 'Smoking status for the block. Possible values are: 0 - undefined, 1 - smoking, 2 - non-smoking, 3
            - both options available.'
        max_children_free_age:
          type: integer
          format: int32
          description: The age of children that can stay free of charge
        deal_tagging:
          $ref: '#/components/schemas/DealTaggingDto'
        free_wifi:
          type: boolean
          description: Boolean value set to "true" if free wifi is provided or "false" if free wifi is not provided.
        internet_included:
          type: boolean
          description: Boolean value set to "true" if free internet is provided or "false" if free internet is not provided.
        mcid:
          type: integer
          format: int32
          description: A code that represents the ID of the price campaign
        ppt:
          type: string
          description: Pricing Product Tag indicating applied pricing products (e.g. G1GM = Genius L1 + Geo + Mobile)
        cancellation_info:
          type: array
          description: Cancellation information and schedule for the block
          items:
            $ref: '#/components/schemas/CancellationStageDto'
      description: 'The object containing all the relevant information for the combination of room, policy, meal and occupancy
        that determines the price."

        A block is the unique entity you book with booking.com.'
    BlockAvailabilityResponseDto:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/BlockAvailabilityOutputDto'
        meta:
          $ref: '#/components/schemas/Meta'
    Location:
      description: Geographic location of the property.
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: nl
        latitude:
          type: number
          format: double
          description: Latitude in decimal degrees.
          example: 52.3702
        longitude:
          type: number
          format: double
          description: Longitude in decimal degrees.
          example: 4.8952
        street_address:
          type: string
          description: Street address, localized to the requested language.
          example: Prins Hendrikkade 59
        city:
          type: string
          description: City name, localized to the requested language.
          example: Amsterdam
        postal_code:
          type: string
          description: Postal or ZIP code.
          example: 1012 AD
        province:
          type: string
          description: Province or state, localized to the requested language.
          example: North Holland
    Image:
      description: 'A single property image: its CDN URL and image type (e.g. "main").'
      properties:
        url:
          type: string
          description: Image URL on the Booking.com image CDN, with the requested image_size applied.
          example: https://q-xx.bstatic.com/xdata/images/hotel/max500/681992303.jpg?k=<sig>&o=
        type:
          type: string
          description: Image type. Currently always "main".
          example: main
    Links:
      description: Partner-facing links to the property.
      properties:
        booking_url:
          type: string
          description: Partner-attributed link to the property page on Booking.com.
          example: https://www.booking.com/hotel/nl/grand-central.html?aid=343802
        booking_deep_link_url:
          type: string
          description: Partner-attributed deep link that opens the property in the Booking.com app.
          example: https://www.booking.com/hotel/nl/grand-central.html?aid=343802&utm_medium=deeplink
    Policies:
      description: Check-in/check-out times and bookability policies.
      properties:
        check_in_start_time:
          type: string
          description: Earliest check-in time, local to the property (HH:mm).
          example: '15:00'
        check_in_end_time:
          type: string
          description: Latest check-in time, local to the property (HH:mm).
          example: '23:00'
        check_out_start_time:
          type: string
          description: Earliest check-out time, local to the property (HH:mm).
          example: 07:00
        check_out_end_time:
          type: string
          description: Latest check-out time, local to the property (HH:mm).
          example: '11:00'
        is_instant_bookable:
          type: boolean
          description: Whether the property can be booked instantly (no host confirmation).
          example: true
    PropertyStreamRecord:
      description: One property record emitted as one line in the NDJSON property stream.
      properties:
        property_id:
          type: integer
          format: int64
          description: Booking.com property identifier.
          example: 1377102
        name:
          type: string
          description: Property name, localized to the requested language.
          example: Grand Central Hotel
        description:
          type: string
          description: Free-text property description, localized to the requested language. Always present.
          example: Featuring air-conditioned accommodation with a balcony, the property offers a private pool.
        category:
          type: string
          description: Accommodation type of the property, as a lowercase snake_case token.
          enum:
          - apartment
          - hostel
          - hotel
          - motel
          - resort
          - bed_and_breakfast
          - ryokan
          - farm_stay
          - holiday_park
          - villa
          - camping
          - boat
          - guest_house
          - inn
          - aparthotel
          - holiday_home
          - lodge
          - homestay
          - country_house
          - tented_camp
          - capsule_hotel
          - love_hotel
          - riad
          - chalet
          - japanese_style_business_hotel
          - gite
          - sanatorium
          - cruise
          - student_accommodation
          example: hotel
        number_of_rooms:
          type: integer
          format: int64
          description: Number of bookable rooms or units. Most inventory is single-unit (apartments and holiday homes), so
            1 is the most common value.
          example: 1
        images:
          type: array
          description: Property images on the Booking.com image CDN, each with its URL and type. Populated for ~98.6% of properties;
            omitted when the property has no image.
          items:
            $ref: '#/components/schemas/Image'
        language:
          type: string
          description: BCP-47 language code the localizable fields are returned in (echoes the request).
          example: en-gb
        updated_at:
          type: string
          description: ISO-8601 UTC timestamp of the last change to this property record.
          example: '2026-07-06T14:21:56.000Z'
        location:
          $ref: '#/components/schemas/Location'
        ratings:
          $ref: '#/components/schemas/Ratings'
        policies:
          $ref: '#/components/schemas/Policies'
        links:
          $ref: '#/components/schemas/Links'
        status:
          $ref: '#/components/schemas/Status'
    Ratings:
      description: Star rating and guest review aggregates.
      properties:
        star_rating:
          type: number
          format: double
          description: Official star rating from 1.0 to 5.0. Unrated properties (e.g. many apartments) use 0.0, not null.
          example: 5
        is_star_rating_estimated:
          type: boolean
          description: Whether the star rating is estimated by Booking.com rather than officially assigned. Always present.
          example: false
        guest_review_score:
          type: number
          format: double
          description: Average guest review score, from 1 to 10.
          example: 8.6
        guest_review_count:
          type: integer
          format: int64
          description: Number of guest reviews the score is based on.
          example: 1243
    Status:
      description: Lifecycle status of the property.
      properties:
        property_status:
          type: string
          description: 'Lifecycle status of the property: open (bookable) or closed (not bookable).'
          enum:
          - open
          - closed
          example: open
        last_active_date:
          type: string
          format: date
          description: Date the property was last active in the feed, as an ISO date (YYYY-MM-DD).
          example: '2026-07-07'
    PropertyStreamRequest:
      properties:
        languages:
          type: array
          description: Exactly one BCP-47 language code. Localizable fields are returned in this language. More than one language
            is not currently supported and returns HTTP 400.
          example:
          - en-gb
          items:
            type: string
            description: Exactly one BCP-47 language code. Localizable fields are returned in this language. More than one
              language is not currently supported and returns HTTP 400.
            example: '["en-gb"]'
        updated_since:
          type: string
          description: Optional ISO-8601 UTC timestamp with millisecond precision. When set, only properties changed at or
            after this instant are returned (delta sync); when omitted, the full inventory is returned.
          example: '2026-04-20T00:00:00.000Z'
        image_size:
          type: string
          default: standard
          description: 'Size token applied to every image URL:

            - `thumbnail`: 100×100, square, center-cropped

            - `thumbnail_large`: 300×300, square, center-cropped

            - `standard`: up to 500px on the longest side (default)

            - `large`: up to 1280px on the longest side'
          enum:
          - thumbnail
          - thumbnail_large
          - standard
          - large
    BedConfigurationDto:
      type: object
      properties:
        id:
          type: string
          description: Uniquely identifies this bed configuration.
        configuration:
          type: array
          description: Detail list of all different types and number of beds included in this configuration.
          items:
            $ref: '#/components/schemas/BedDto'
      description: Lists all alternative bed configurations that are supported.
    CheckinCheckoutTimesDto:
      type: object
      properties:
        checkin_from:
          $ref: '#/components/schemas/LocalTime'
        checkin_to:
          $ref: '#/components/schemas/LocalTime'
        checkout_from:
          $ref: '#/components/schemas/LocalTime'
        checkout_to:
          $ref: '#/components/schemas/LocalTime'
    CoordinatesDto:
      type: object
      properties:
        latitude:
          multipleOf: 1.0e-05
          type: number
          description: Latitude.
          format: double
          example: 52.375859
        longitude:
          multipleOf: 1.0e-05
          type: number
          description: Longitude.
          format: double
          example: 4.886006
      description: A signed integer number that uniquely identifies a city.
    BedDto:
      type: object
      properties:
        bed_type:
          type: integer
          description: 'A signed integer number that uniquely identifies a bed type. Examples of bed types are: Single, Double
            etc.'
          format: int32
        number_of_beds:
          type: integer
          description: Number of similar beds included in this configuration.
          format: int32
      description: Detail list of all different types and number of beds included in this configuration.
    LocalTime:
      pattern: (0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]:00
      type: object
      properties:
        hour:
          type: integer
          format: int32
        minute:
          type: integer
          format: int32
        second:
          type: integer
          format: int32
        nano:
          type: integer
          format: int32
      description: The time till when checkout can be done at this property.
    BlockAvailabilityPriceDto:
      type: object
      description: Price details
      properties:
        price:
          type: number
          format: double
          description: Price in the hotel currency.
        currency:
          type: string
          description: Three-letter ISO currency code that the price is shown in.
          example: EUR
        other_currency:
          $ref: '#/components/schemas/PriceOtherCurrency'
        extra_charges_breakdown:
          $ref: '#/components/schemas/ChargesBreakdownDto'
    PriceOtherCurrency:
      type: object
      description: Price in the other currency.
      properties:
        currency:
          type: string
          description: Three-letter ISO currency code that the price is shown in.
          example: EUR
        price:
          type: number
          format: double
          description: Price in the other currency.
    ChargesBreakdownDto:
      type: object
      description: This element contains an array with the breakdown of taxes, fees and charges. This covers all the extra
        charges (included and excluded) that are applicable to this block.
      properties:
        net_price:
          type: number
          format: double
          description: Net component of price in the indicated currency.
        net_price_other_currency:
          allOf:
          - $ref: '#/components/schemas/PriceOtherCurrency'
          - description: Net component of price in the other currency.
        extra_charge:
          type: array
          description: A breakdown of each extra charge.
          items:
            $ref: '#/components/schemas/BlockAvailabilityChargeDto'
    BlockAvailabilityChargeDto:
      type: object
      description: A breakdown of each extra charge.
      properties:
        currency:
          type: string
          description: Three-letter ISO currency code that the charge is shown in.
          example: EUR
        charge_amount:
          type: number
          format: double
          description: The charge that is used along with charge_price_mode to calculate the amount.
        amount:
          type: number
          format: double
          description: Extra charge amount in the indicated currency.
        type:
          type: string
          description: Extra charge type.
        name:
          type: string
          description: Extra charge name.
        name_id:
          type: integer
          format: int32
          description: The ID that identifies the name of the extra charge.
        charge_price_mode:
          type: integer
          format: int32
          description: Determines the method of calculating the charge.
        excluded:
          type: boolean
          description: Boolean value set to "true" if the extra charge is excluded or "false" if it is included.
        other_currency:
          allOf:
          - $ref: '#/components/schemas/OtherCurrency'
          - description: Extra charge in the other currency.
        is_conditional:
          type: boolean
          description: 'Set as "true" if this is a conditional charge. Not present otherwise. Example of conditional charge:
            cleaning fee in case of pets.'
    OtherCurrency:
      type: object
      properties:
        currency:
          type: string
          description: Three-letter ISO currency code that the charge is shown in.
          example: EUR
        amount:
          type: number
          format: double
          description: Charge amount in the other currency.
    DealTaggingDto:
      type: object
      properties:
        deal_name:
          type: string
          description: Name of the deal being applied to this rate.
          example: Geo Rates + Deals of the Day
        discount_percentage:
          type: integer
          format: int32
          description: The % value of the discount.
        platform:
          type: string
          description: When the deal tag is Mobile, this value will describe whether the deal is for 'Web' or 'App' users
        public_price:
          allOf:
          - $ref: '#/components/schemas/BlockAvailabilityPriceDto'
          - description: Details on the public price value for this block (in order to determine the amount of discount).
        best_price_without_genius:
          allOf:
          - $ref: '#/components/schemas/BlockAvailabilityPriceDto'
          - description: Best price excluding Genius deal. Included in a response only if Genius deal is applied.
    CancellationStageDto:
      type: object
      description: Cancellation information and schedule for the block
      properties:
        from:
          type: string
          description: 'The date and time of the beginning of the cancellation period for the given fee. Format: YYYY-MM-DD
            HH:MM:SS, in the timezone reported by timezone.'
        until:
          type: string
          description: 'The date and time of the end of the cancellation period for the given fee. Format: YYYY-MM-DD HH:MM:SS,
            in the timezone reported by timezone.'
        fee:
          type: number
          format: double
          description: Cancellation fee for the given period, in the currency indicated.
          example: 309.96
        currency:
          type: string
          description: Three-letter ISO currency code that the fee is given in.
          example: EUR
        timezone:
          type: string
          description: Timezone that from and until are given in.
          example: CET
        guest_currency:
          type: string
          description: Three-letter ISO currency code that guest_currency_fee is given in. Present only when the guest currency
            differs from the block currency.
          example: USD
        guest_currency_fee:
          type: number
          format: double
          description: Cancellation fee for the given period, converted to guest_currency. Present only when the guest currency
            differs from the block currency.
          example: 352.78
        guest_currency_fee_pretty:
          type: string
          description: 'Cancellation fee for the given period, converted to guest_currency and formatted for display: rounded
            and with the currency symbol. Present only when the guest currency differs from the block currency.'
          example: $352.78
    HotelPolicyDto:
      type: object
      description: Hotel-level policy with structured enum data
      properties:
        class:
          type: string
          description: Policy type identifier
          example: POLICY_HOTEL_PETS
        pets:
          $ref: '#/components/schemas/PetsPolicyData'
        internet:
          $ref: '#/components/schemas/InternetPolicyData'
        parking:
          $ref: '#/components/schemas/ParkingPolicyData'
        children:
          $ref: '#/components/schemas/ChildrenPolicyData'
        max_rooms:
          type: integer
          format: int32
          description: Maximum rooms before group policies apply (present when class is POLICY_HOTEL_GROUPS)
          example: 5
    PetsPolicyData:
      type: object
      description: Pets policy information
      properties:
        allowed:
          type: string
          description: Whether pets are allowed
          enum:
          - 'YES'
          - 'NO'
          - UPON_REQUEST
          example: 'YES'
        charge_mode:
          type: string
          description: The charge mode for pets
          enum:
          - FREE
          - CHARGES_MAY_APPLY
          example: CHARGES_MAY_APPLY
    InternetPolicyData:
      type: object
      description: Internet policy information
      properties:
        connection_type:
          type: string
          description: The type of internet connection
          enum:
          - WIFI
          - WIRED
          example: WIFI
        coverage:
          type: string
          description: The coverage area for internet access
          enum:
          - ALL_ROOMS
          - SOME_ROOMS
          - PUBLIC_AREAS
          - BUSINESS_CENTER
          - ENTIRE_PROPERTY
          example: ALL_ROOMS
        charge_mode:
          type: string
          description: The charge mode for internet access
          enum:
          - FREE
          - PAID
          example: FREE
    ParkingPolicyData:
      type: object
      description: Parking policy information
      properties:
        type:
          type: string
          description: The type of parking available
          enum:
          - PRIVATE
          - PUBLIC
          example: PRIVATE
        location:
          type: string
          description: The location of parking
          enum:
          - ON_SITE
          - NEARBY
          example: ON_SITE
        charge_mode:
          type: string
          description: The charge mode for parking
          enum:
          - FREE
          - PAID
          example: FREE
    ChildrenPolicyData:
      type: object
      description: Children policy information
      properties:
        allowed:
          type: boolean
          description: Whether children are allowed at the property
          example: true
        minimum_age:
          type: integer
          format: int32
          description: The minimum age for children (0 means all ages welcome)
          example: 0
        cots_and_beds:
          type: array
          description: Rules for cots and extra beds by age range
          items:
            $ref: '#/components/schemas/CotsAndBedsData'
    CotsAndBedsData:
      type: object
      description: Cots and extra beds policy rule
      properties:
        type:
          type: string
          description: Type of sleeping arrangement
          enum:
          - CRIB
          - EXISTING_BED
          - EXTRA_BED
          example: CRIB
        from_age:
          type: integer
          format: int32
          description: Minimum age for this rule (inclusive)
          example: 0
        to_age:
          type: integer
          format: int32
          description: Maximum age for this rule (inclusive)
          example: 3
        charge_mode:
          type: string
          description: How the charge is applied
          enum:
          - FREE
          - PER_NIGHT
          - PER_STAY
          example: FREE
        price:
          type: number
          format: double
          nullable: true
          description: Price for this rule (null if free)
          example: 15
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: string
