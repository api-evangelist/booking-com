  /demand-api-v2-compatible/hotelAvailability:
    get:
      tags:
      - demand-api-v2-compatible
      summary: List available hotel rooms
      description: 'This endpoint returns the cheapest available room for each hotel matching your check-in and check-out
        dates.

        You can search a specific list of up to 1000 hotels with `hotel_ids`, or an area with `latitude`, `longitude` and
        `radius` (the two are mutually exclusive).

        For each hotel you get whether the price includes breakfast or other meals and whether it can be cancelled for free.

        Request the `room_details` extra for a per-room price breakdown, and use `add_filtered_rate`/`options` to filter the
        results.


        String enum values (such as `user_platform`, `extras`, `options`, `add_filtered_rate`, `order_by` and `order_dir`)
        are case-insensitive. `language` accepts the lowercase codes listed below.

        '
      operationId: getHotelAvailability
      parameters:
      - name: checkin
        in: query
        required: true
        schema:
          type: string
          description: The arrival date.
          format: date
      - name: checkout
        in: query
        required: true
        schema:
          type: string
          description: The departure date. Must be later than {checkin}. Must be between 1 and 30 days after {checkin}.
          format: date
      - name: guest_country
        in: query
        required: true
        schema:
          type: string
          description: Guest country code (ISO 3166-1 alpha-2). Used to display the most accurate prices and price details
            for guests from that country.
          example: nl
      - name: hotel_ids
        in: query
        schema:
          maxItems: 1000
          minItems: 0
          type: array
          description: 'Limit the result to up to 1000 specific hotels that have availability for the given guests and dates.

            Mutually exclusive with `latitude`/`longitude`: use either a hotel list or an area search, not both.

            '
          example:
          - 96969
          items:
            type: integer
            format: int32
      - name: latitude
        in: query
        schema:
          maximum: 90
          minimum: -90
          multipleOf: 1.0e-05
          type: number
          description: 'Latitude for an area search, used together with `longitude` and `radius`.

            Requires `longitude`; cannot be combined with `hotel_ids`.

            '
          format: double
      - name: longitude
        in: query
        schema:
          maximum: 180
          minimum: -180
          multipleOf: 1.0e-05
          type: number
          description: 'Longitude for an area search, used together with `latitude` and `radius`.

            Requires `latitude`; cannot be combined with `hotel_ids`.

            '
          format: double
      - name: radius
        in: query
        schema:
          maximum: 100
          minimum: 15
          type: number
          description: Search radius in km around `latitude`/`longitude`. Only applies to an area search. Minimum and default
            15, maximum 100.
          format: double
          default: 15
      - name: room1
        in: query
        schema:
          type: string
          description: 'Guests per room, as a comma-separated list: `A` for each adult and the age (0-17) for each child (e.g.
            `A,A,5` = two adults and a 5-year-old).

            For multi-room searches, repeat the parameter per room as `room1`, `room2`, ... up to `room30`.

            '
      - name: no_rooms
        in: query
        schema:
          minimum: 1
          type: integer
          description: 'Splits a single guest group into this many rooms automatically. Only applied when exactly one room
            group is provided and the value is between 2 and the number of adults inclusive; larger values have no effect.

            '
          format: int32
      - name: currency
        in: query
        schema:
          type: string
          description: Return prices in this currency (ISO 4217 code).
          example: EUR
      - name: language
        in: query
        schema:
          type: string
          description: The user's language.
          default: en-gb
          enum:
          - ar
          - bg
          - ca
          - cs
          - da
          - de
          - el
          - en
          - en-gb
          - en-us
          - es
          - es-ar
          - es-mx
          - et
          - fi
          - fr
          - he
          - hi
          - hr
          - hu
          - id
          - is
          - it
          - ja
          - ka
          - ko
          - lt
          - lv
          - ms
          - nl
          - 'no'
          - pl
          - pt-br
          - pt-pt
          - pt
          - ro
          - ru
          - sk
          - sl
          - sr
          - sv
          - th
          - tl
          - tr
          - uk
          - vi
          - zh
          - zh-cn
          - zh-tw
      - name: user_platform
        in: query
        schema:
          type: string
          description: The user's platform.
          enum:
          - ANDROID
          - DESKTOP
          - IOS
          - MOBILE
          - TABLET
      - name: genius
        in: query
        schema:
          maximum: 3
          minimum: 0
          type: integer
          description: Genius loyalty level (0-3) used to include Genius rates the partner is eligible for. Defaults to 0
            (no Genius rates).
          format: int32
          default: 0
      - name: extras
        in: query
        schema:
          type: array
          description: The extra items for this request. See the documentation for more details about each extra.
          items:
            type: string
            description: The extra items for this request. See the documentation for more details about each extra.
            enum:
            - HOTEL_DETAILS
            - HOTEL_AMENITIES
            - ROOM_DETAILS
            - ROOM_AMENITIES
            - ROOM_POLICIES
            - PAYMENT_TERMS
            - ADD_CHEAPEST_BREAKFAST_RATE
            - PPT
      - name: options
        in: query
        schema:
          type: array
          description: The list of options to filter the results.
          items:
            type: string
            description: The list of options to filter the results.
            enum:
            - NO_DORMS
            - IS_24HR
      - name: add_filtered_rate
        in: query
        schema:
          type: array
          description: The list of rates to filter the results.
          items:
            type: string
            description: The list of rates to filter the results.
            enum:
            - BREAKFAST
            - FREE_CANCELLATION
      - name: order_by
        in: query
        schema:
          type: string
          description: The way to order your results. When ordering by distance, make sure to specify latitude and longitude.
          default: RANKING
          enum:
          - DISTANCE
          - POPULARITY
          - PRICE
          - RANKING
          - REVIEW_SCORE
          - STARS
      - name: order_dir
        in: query
        schema:
          type: string
          description: The direction you wish for your order_by parameter to be ordered in.
          default: ASC
          enum:
          - ASC
          - DESC
      - name: rows
        in: query
        schema:
          maximum: 1000
          type: integer
          description: The maximum number of results to return.
          format: int32
      - name: page
        in: query
        schema:
          type: string
          description: Pagination token used to retrieve the next page of results. Obtained from `next_page`.
      - name: Accept
        in: header
        schema:
          type: string
          enum:
          - application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        hotel_id:
                          type: integer
                          description: The unique identifier of this hotel.
                          format: int32
                        hotel_currency_code:
                          type: string
