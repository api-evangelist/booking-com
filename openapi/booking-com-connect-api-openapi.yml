        country:
          type: string
          description: " Limits reviews to those written by bookers from the given country.\n This code is defined by the\
            \ ISO 3166-1 alpha-2 standard (ISO2) as described here: https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2.\n"
          example: nl
          pattern: ^[a-z]{2}$
        offset:
          type: integer
          format: int32
          default: 0
          description: The number of rows to offset the results by.
          minimum: 0
        rows:
          type: integer
          format: int32
          default: 10
          description: The maximum number of rows to return.
          minimum: 1
        last_change:
          type: string
          description: 'Limits the reviews to those changed after the given date in Europe/Amsterdam time zone. Format: ''yyyy-MM-dd
            HH:mm:ss''.'
          example: '2025-11-20 14:05:30'
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$
        score_lower_bound:
          type: integer
          format: int32
          description: "Limits the reviews to those having score greater or equal to this value.\n Possible values are natural\
            \ numbers in range [1 - 10].\n"
          maximum: 10
          minimum: 1
        score_upper_bound:
          type: integer
          format: int32
          description: "Limits the reviews to those having score lesser or equal to this value.\n Possible values are natural\
            \ numbers in range [1 - 10].\n"
          maximum: 10
          minimum: 1
        extras:
          type: string
          description: "Specify here what extra items of the result should be included.\n See the endpoint description for\
