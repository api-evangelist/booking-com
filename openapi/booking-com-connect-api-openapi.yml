openapi: 3.0.1
info:
  title: Connect API
  description: 'Partner Connect API Service

    '
  version: 1.2.2
servers:
- url: https://metasearch-connect-api.booking.com
  description: Production URL
security:
- BearerAuth: []
paths:
  /reports/conversions:
    post:
      tags:
      - Reports
      summary: List conversions
      description: "This endpoint returns conversion data for bookings within a specified date range.\n\n**Note:** Conversions\
        \ data is only provided for selected accounts based on contractual agreements.\n\nExactly one date filter must be\
        \ provided. The available filters are:\n- `booking_date_range`: Filter by the date the booking was made\n- `cancellation_date_range`:\
        \ Filter by the date the booking was cancelled\n- `checkout_date_range`: Filter by the checkout date of the booking\n\
        \nEach date range must include both `from` and `to` dates in ISO-8601 format (YYYY-MM-DD).\nResults are paginated\
        \ with a default page size of 100 and a maximum of 1000 records per page.\nUse the `page_token` from the response\
        \ to retrieve subsequent pages.\n\n**Example requests:**\n\nFilter by booking date:\n```json\n{\n  \"booking_date_range\"\
        : {\n    \"from\": \"2025-01-01\",\n    \"to\": \"2025-01-31\"\n  },\n  \"page_size\": 100\n}\n```\n\nFilter by cancellation\
        \ date:\n```json\n{\n  \"cancellation_date_range\": {\n    \"from\": \"2025-01-01\",\n    \"to\": \"2025-01-31\"\n\
        \  },\n  \"page_size\": 100\n}\n```\n\nFilter by checkout date:\n```json\n{\n  \"checkout_date_range\": {\n    \"\
        from\": \"2025-01-01\",\n    \"to\": \"2025-01-31\"\n  },\n  \"page_size\": 100\n}\n```\n"
      operationId: getConversions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversionsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversionsResponse'
        '400':
          description: Bad Request - Invalid input parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                conflicting_filters:
                  summary: Multiple date filters provided
                  description: Returned when more than one date filter is specified in the request
                  value:
                    errors:
                    - id: conflicting_parameters
                      name: Conflicting Parameters
                      message: Parameters booking_date_range, cancellation_date_range are mutually exclusive.
                    request_id: req_abc123xyz
                missing_filter:
                  summary: No date filter provided
                  description: Returned when no date filter is specified in the request
                  value:
                    errors:
                    - id: invalid_parameter
                      name: Invalid Parameter
                      message: 'Exactly one date filter must be specified: booking_date_range, cancellation_date_range, or
                        checkout_date_range'
                    request_id: req_abc123xyz
  /inventory/properties:
    post:
      tags:
      - Inventory
      summary: List accommodation properties
      description: 'Returns the Booking.com property inventory as a newline-delimited JSON (NDJSON) stream, one property object
        per line. Each record carries static content such as names, addresses, categories, images, ratings, and policies.
        API consumers use it to build and refresh a local copy of the inventory.


        ## Parameters

        - `languages` (required): a single BCP-47 language code (e.g. `fr`, `en-gb`). Localizable fields such as `name`, `description`,
        `location.city`, and `location.province` are returned in this language.

        - `updated_since` (optional): an ISO-8601 UTC timestamp with millisecond precision (e.g. `2026-04-20T00:00:00.000Z`).
        When set, only properties changed at or after this instant are returned (delta sync). When omitted, the full inventory
        is returned.

        - `image_size` (optional): the size token applied to every image URL. One of `thumbnail`, `thumbnail_large`, `standard`,
        or `large`. Defaults to `standard`.


        ## Response protocol

        Each line is one complete JSON object. A data row carries the property fields:


        ```

        {"property_id":1377102,"name":"Grand Central Hotel","description":"Featuring air-conditioned accommodation with a
        balcony, the property offers a private pool.","category":"hotel","number_of_rooms":1,"images":[{"url":"https://q-xx.bstatic.com/xdata/images/hotel/max500/681992303.jpg?k=<sig>&o=","type":"main"}],"language":"en-gb","updated_at":"2026-07-06T14:21:56.000Z","location":{"country":"nl","latitude":52.3702,"longitude":4.8952,"street_address":"Prins
        Hendrikkade 59","city":"Amsterdam","postal_code":"1012 AD","province":"North Holland"},"ratings":{"star_rating":5.0,"is_star_rating_estimated":false,"guest_review_score":8.6,"guest_review_count":1243},"policies":{"check_in_start_time":"15:00","check_in_end_time":"23:00","check_out_start_time":"07:00","check_out_end_time":"11:00","is_instant_bookable":true},"links":{"booking_url":"https://www.booking.com/hotel/nl/grand-central.html?aid=343802","booking_deep_link_url":"https://www.booking.com/hotel/nl/grand-central.html?aid=343802&utm_medium=deeplink"},"status":{"property_status":"open","last_active_date":"2026-07-07"}}

        ```


        The final line is a completion marker:


        ```

        {"_control":"complete","data_row_count":4055137}

        ```


        Every line may carry a `_control` field that marks the line type:

        - Data rows use `"_control":"data"`. This is the default and is omitted to reduce response size, so a line with no
        `_control` field is a data row.

        - The final line is the completion marker, `"_control":"complete"`. It reports `data_row_count`, the number of data
        rows emitted.


        To confirm the stream is complete, match `data_row_count` against the number of data rows received. If the completion
        marker is absent, the stream was truncated and the response must be discarded.


        > **Preview version: temporary constraints (subject to change without notice)**

        >

        > This endpoint is a preview version. Only one language per request is currently supported; requesting more than one
        returns HTTP 400. An API consumer that needs several languages sends one request per language, in parallel.


        ## Errors

        `400 Bad Request` with a JSON error body is returned for invalid input: more than one `languages` entry, an unsupported
        `image_size`, or a malformed `updated_since` timestamp.'
      operationId: streamProperties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyStreamRequest'
        required: true
      responses:
        '200':
          description: NDJSON stream. Each line is a property stream record.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/PropertyStreamRecord'
        '400':
          description: Invalid input (e.g. more than one language, unknown image_size, or a malformed updated_since timestamp).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Multiple languages:
                  description: Multiple languages
                  value:
                    request_id: b1a2c3d4e5f6
                    errors:
                    - id: invalid_parameter
                      name: Invalid Value
                      message: Parameter 'languages' is invalid. Only one language per request is supported (got 2)
  /demand-api-v2-compatible/reviews:
    get:
      tags:
      - demand-api-v2-compatible
      summary: List accommodation reviews
      description: 'Returns reviews for specified hotel_ids and filters. Available filters are country,

        language of the review, lower and upper bound of the review score, and timestamp of the last change to the review.

        The ''last_change'' output field will only be displayed if the last_change=... input parameter is set.

        '
      operationId: getHotelsReviews
      parameters:
      - name: reviewsInputDto
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ReviewsInputDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewsResponseDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/ReviewsResponseDto'
        '400':
          description: Invalid input, e.g. a missing, invalid, unknown, or conflicting parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2Error'
              example:
                meta:
                  ruid: b1a2c3d4e5f6
                  account_id: '123432'
                errors:
                - id: invalid_parameter
                  name: Invalid Value
                  message: Parameter 'hotel_ids' is invalid.
            application/xml:
              schema:
                $ref: '#/components/schemas/V2Error'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2Error'
              example:
                meta:
                  ruid: b1a2c3d4e5f6
                  account_id: '123432'
                errors:
                - id: server_error
                  name: Internal Server Error
                  message: We are experiencing technical difficulties. Please try again later.
            application/xml:
              schema:
                $ref: '#/components/schemas/V2Error'
  /demand-api-v2-compatible/reviewScores:
    get:
      tags:
      - demand-api-v2-compatible
      summary: List accommodation review scores
      description: 'Gives information about review scores for specified hotel_ids and filter.

        The information consists of score breakdown per reviewer_type and review questions,

        and overall score distribution per score value (1 - 10).


        The available filter is input parameter reviewer_type=... .

        It allows generating review score information for just one reviewer type.


        Language in which the response is rendered can be controlled with the input parameter language=...

        (default: ''en''). Setting the language will reflect on the output fields question and review_score_word.


        One additional output field can be requested with input parameter extras=review_score_word.

        '
      operationId: getHotelsReviewScores
      parameters:
      - name: reviewScoresInputDto
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ReviewScoresInputDto'
      - name: Accept
        in: header
        schema:
          type: string
          enum:
          - application/json, application/xml
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseOutputV2ReviewScoresOutputDto'
        '400':
