                      success: 1
                      status: Addendum invitation resent to Partner.
                    warnings: []
                    meta:
                      ruid: UmFuZG9tSVYkc2RlIyh9YUNOyFG1G7yZ4N4g32GjUq4m7gLy4mLHvgfKCKKcaShQJ1ARh2IeVOWB/7DRTmDzp3Eh6SJyAq2mtqfDc16BxoY=
        '400':
