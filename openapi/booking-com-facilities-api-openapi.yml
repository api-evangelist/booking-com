openapi: 3.0.1
info:
  title: Facilities API
  description: 'Manage facilities at both the property- and room-level.<br>

    Booking.com supports adding or assigning a variety of different facilities at the property- or room-level.

    Specify the facility ID along with any required parameters to assign a facility.<br><br>Facilities are of the following
    types:

    <ul><li>Single-instance facilities: You can assign these facilities only once to a property or a room.

    An example of a single-instance facility is: room service. There are two types of single-instance facilities:

    <ul><li>Single-instance facilities that can be toggled on or off.</li><li>Single-instance facilities supporting optional
    parameters:

    Allows you to specify more details about the facility</li></ul><li>Multi-instance facilities:

    You can assign multiple facilities of this type to a property.

    When adding multi-instance facilities you must provide additional details to add to a property or a room.

    Examples of multi-instance facilities are: Restaurant, Swimming pool and Parking.</li></ul>

    '
  contact:
    name: Connectivity Team
    url: https://connect.booking.com
    email: connectivity@booking.com
  version: '1.0'
servers:
- url: https://supply-xml.booking.com/
  description: Test using live endpoint
tags:
- name: About Try it
  description: "Learn how to effectively use the Try it feature in the Facilities API documentation.\n\nUse the **Try it**\
    \ feature to send sample requests to API endpoints directly from the developer portal. In the **Mock (schema only)** environment,\
    \ Try it returns schema-driven mock responses or pre-built example responses. In the **Production** environment, it sends\
    \ the request to the live API and returns dynamic responses from your selected test property.\n\n## Environment\n\nYou\
    \ can select between two different environments (top right corner in the UI):\n\n**Mock (schema only)** (default):\n-\
    \ Helps to understand the response data schema\n- Recommended for all write operations (POST, PUT, DELETE)\n- Environment\
    \ for testing without affecting live/test data\n\n**Test live endpoint**:\n- Make sure to use only test properties.\n\
    - Changes will affect your test property data\n- Requires valid credentials\n- Same API structure as production\n\n##\
    \ Request\n\nYou can click on any unresolved placeholders to add a value or edit an existing placeholder value.\n\nThe\
    \ portal loads the default request body. Where the specification supports multiple request body examples (for example:\
    \ Rooms API POST endpoint), you can choose a different request body from the drop-down list.\n\nSome helpful pointers\
    \ before running a request:\n\n- **Authentication** (when using live endpoint): Configure your authentication headers\n\
    \  - API Key or OAuth token as required. Use the **Environments** tab.\n  - Make sure to manage separate machine accounts\
    \ for test vs. properties in production.\n  - Ensure credentials match your selected environment.\n\n- **Parameters**:\
    \ Fill in required parameters\n  - Path parameters (like `propertyId`)\n  - Query parameters (like `language_code`)\n\
    \  - Request body for `POST/PUT` operations\n\n- **Execute**: Click **Send** to send the request\n  - The request is sent\
    \ to the selected environment\n  - When sending requests to the live endpoint, real HTTP request is made to the API\n\n\
    ## Response\n\nThe Try it feature provides comprehensive response information to the extent supported by the Open API\
    \ specification:\n\n### Status code\n- **2xx**: Success responses (200)\n- **4xx**: Client errors (400 Bad Request, 401\
    \ Unauthorized, 404 Not Found)\n- **5xx**: Server errors (500 Internal Server Error)\n\n### Response body\n- JSON formatted\
    \ response data\n\nIf the returned response, by default, is unformatted, select the supported Response body format in\
    \ the UI.\n\n### Response headers\n- Content-Type, Content-Length.\n\n## Environments\n\nThe **Environments** tab allows\
    \ you to create variables specific to the environment. For example, you can add a variable to hold the value of the `property-id`\
    \ placeholder. The portal inserts the respective value depending on the environment at the time of sending the request.\n\
    \n### Variables\n\nMost of the endpoints (especially POST/PUT/DELETE) require you to add a path or query parameter before\
    \ sending the request. The Open API specification marks these parameters with placeholder tags. For example, {{`property_id`}}.\
    \ You can use the **Environments** tab to manage the values for these placeholders as variables.\n\n#### Path parameters\n\
    - **Required**: Must be provided to make the request\n- **Type validation**: Ensures correct data types (integer, string,\
    \ etc.)\n- **Example**: `propertyId` in `/facilities-api/properties/{propertyId}`\n\n#### Query parameters\n- **Optional**:\
    \ Usually have default values\n- **Example**: `language_code` with `en-us` as the default value\n\n#### Request body\n\
    - **Schema validation**: Follows OpenAPI schema definitions\n- **Example data**: Prepopulated with sample values\n\n##\
    \ Best practices\n\nThis section provides some basic practice guidelines.\n\n### Authentication\n\n- Always use separate\
    \ machine accounts for test properties vs. properties in production.\n- When testing with production endpoint, make sure\
    \ to use only test properties.\n\n### For Read operations (GET)\n- Safe to test in any environment\n- Use valid IDs that\
    \ exist in your system\n- Check response structure for integration planning\n\n### For Write operations (POST, PUT)\n\
    - **Always use Mock (schema only) environment first**\n- Verify request payload structure\n- Check response for success\
    \ confirmation\n- Test error scenarios with invalid data\n\n### For Delete operations (DELETE)\n- **Preferable to use\
    \ Mock (schema only) environment only**\n- Understand the operation is irreversible\n- Have backup data when testing using\
    \ test properties\n\n## Troubleshooting\n\n### Common issues\n\n**401 Unauthorized**\n- Check authentication credentials\n\
    - Verify API key is valid and not expired\n- Ensure credentials match the selected environment\n\n**400 Bad Request**\n\
    - Validate request payload against schema\n- Check required fields are provided\n- Verify data types match specification\n\
    \n**404 Not Found**\n- Confirm the resource ID exists\n- Check the endpoint URL is correct\n- Verify you have access to\
    \ the resource\n\n### Getting help\n\nIf you encounter issues:\n1. Check the response error message for details\n2. Verify\
    \ your request matches the API specification\n3. Contact the Connectivity Team for support\n\n---\n\n*This documentation\
    \ applies to all endpoints in the Facilities API. The Try it feature provides a consistent testing experience across all\
    \ operations.*"
- name: Manage property facilities
  description: 'Use the GET and the PUT endpoints to:

    <ul><li>Retrieve property-level facilities details</li>

    <li>Add, modify or delete property-level facilities details<ul><li>Add single-instance facilities</li>

    <li>Add multi-instance facilities</li></ul></li></ul>

    '
- name: Manage room facilities
  description: 'Use the GET and the PUT endpoints to:

    <ul><li>Retrieve room facilities set for a property.</li><li>Add, modify or delete room facilities.</li></ul>

    '
- name: Manage bathrooms
  description: 'Use the GET and the PUT endpoints to:

    <ul><li>Retrieve room bathroom configuration</li>

    <li>Add, modify or delete room-level bathroom information</li></ul>

    '
- name: Meta data endpoint
  description: '<p>Retrieve the latest facility definitions.</p>

    <ul>

    <li>Get the list of all supported facilities<ul>

    <li>To get the details of a property-level facility: Look for a matching name under the facility_name in the response.

    To add this facility, you must specify the facility_id.

    Property-level facilities are listed under the property_facility_metas in the meta endpoint response.</li>

    <li>To get the details of the room-level facility: Look for a matching name under the room_facility_name in the response.

    To add the facility, you must specify the room_facility_id.

    Room-level facilities are listed under the room_facility_metas in the meta endpoint response.</li>

    </ul>

    </li>

    <li>Details of the facilities such as ID, OTA code and any optional parameters.</li>

    </ul>

    '
x-tagGroups:
- name: API Endpoints
  tags:
  - Manage property facilities
  - Manage room facilities
  - Manage bathrooms
  - Meta data endpoint
- name: Documentation
  tags:
  - About Try it
paths:
  /facilities-api/properties/{propertyId}:
    get:
      tags:
      - Manage property facilities
      summary: Retrieve property-level facilities
      description: Retrieve facility instance IDs along with the facility details for all the facility instances added to
        the property.
      operationId: getFacilities
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: integer
      - name: debugInfo
        in: query
        required: false
        description: When set to `true`, attaches facility metadata (facility names, OTA codes, allowed detail types) to each
          item in the response. Significantly increases payload size. Do not use in production environments.
        schema:
          type: string
          default: 'false'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListPropertyFacility'
              example:
                data: []
                warnings: []
                errors: []
                meta:
                  ruid: 46fc2375-ed22-430f-8ec4-06d5eca1efbe
    put:
      tags:
      - Manage property facilities
      summary: Add, update or remove property-level facilities
      description: 'Add or update single or multi-instances facilities using this endpoint. Try the available request examples
        in the specification.


        To delete a facility or all instances of a multi-instance facility (for example: all parking facility), you can change
        the facility state to `MISSING`.


        **Important — overlay semantics for multi-instance facilities:** This endpoint replaces the full set of instances
        for any facility you include in the request. If you omit an existing instance, it is permanently deleted. Facility
        types not included in the request are unaffected.


        Before updating a multi-instance facility (Parking, Restaurant, Swimming Pool), call `GET /facilities-api/properties/{propertyId}`
        to retrieve the current instance IDs for that facility, then include **all** of them alongside your changes in the
        PUT body. To add a new instance without disturbing existing ones, include the existing instances with their `instance_id`
        values plus the new instance (without an `instance_id`).

        '
      operationId: setFacilities
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PropertyFacilityRequest'
            examples:
              Add single-instance facilities:
                description: Add/update single-instance facilities
                value:
                - facility_id: 418
                  state: PRESENT
                - facility_id: 419
                  state: MISSING
              Add single-instance facilities with additional details:
                description: Add/update multiple single-instance facilities with surcharge details
                value:
                - facility_id: 70
                  instances:
                  - on_site_details:
                      onsite_type: OFFSITE
                    surcharge_details:
                      surcharge_type: FREE
                  state: PRESENT
              Add parking facilities (multi-instance):
                description: Add parking facilities with detailed options
                value:
                - facility_id: 2
                  instances:
                  - parking_details:
                      name: Basement Parking
                      parking_type: PARKING_LOT
                      parking_location: NEARBY
                      parking_access: ONLY_GUESTS
                      parking_reservation: NEEDED
                      has_valet_service: PRESENT
                      has_onsite_staff: PRESENT
                      has_security_cameras: PRESENT
                      has_ev_charging_station: PRESENT
                      has_gated_parking: PRESENT
                      has_accessible_parking_spots: PRESENT
                    payment_details:
                      charge_mode: PAID
                      charge_details:
                        price: 10
                        frequency: PER_STAY
                  - parking_details:
                      name: QuickPark
                      parking_location: ON_SITE
                      parking_access: GENERAL_PUBLIC
                      parking_reservation: NOT_NEEDED
                      has_gated_parking: PRESENT
                    payment_details:
                      charge_mode: FREE
                  state: PRESENT
              Add restaurant facility (multi-instance):
                description: Add a restaurant facility with details
                value:
                - facility_id: 3
                  instances:
                  - restaurant_details:
                      name: Tastymenu
                      guests_only: false
                      accept_reservations: false
                      outdoor_seating: true
                      meal_types_list:
                      - HALAL
                      - KOSHER
                      - VEGETARIAN
                      - VEGAN
                      - GLUTEN_FREE
                      - DAIRY_FREE
                      ambiances_list:
                      - FAMILY_KIDS_FRIENDLY
                      - ROMANTIC
                      open_for_meals_list:
                      - BREAKFAST
                      - DINNER
                      cuisines_list:
                      - AMERICAN
                      - DUTCH
                      - BRITISH
                      - FRENCH
                      is_buffet: false
                      is_alacarte: true
                  state: PRESENT
              Add swimming pool facility (multi-instance):
                description: Add swimming pool facility with details
                value:
                - facility_id: 433
                  state: PRESENT
                  instances:
                  - swimming_pool_details:
                      name: rooftop pool
                      swimming_pool_type: OUTDOOR
                      availability_type: SEASONABLE
                      allowed_age_type: ALL_AGES
                      has_water_slide: true
                      has_pool_bar: true
                      has_pool_cover: true
                      has_free_towels: true
                      has_pool_toys: true
                      has_sun_umbrellas: true
                      has_fence_around_pool: true
                      has_snake_trap: true
                      is_shared: true
                      is_rooftop: true
                      is_shallow_end: true
                      is_infinity: true
                      is_heated: true
                      is_salt_water: true
                      is_pool_with_view: true
                      is_plunge_pool: true
                    surcharge_details:
                      surcharge_type: PAID
              Update existing and add new swimming pool instance:
                description: Update an existing swimming pool instance and add a new one in the same request. Include `instance_id`
                  for each instance you want to update; omit it for new instances. **You must include all existing instances**
                  — any instance omitted from this array will be permanently deleted.
                value:
                - facility_id: 433
                  state: PRESENT
                  instances:
                  - instance_id: 12345678
                    swimming_pool_details:
                      name: rooftop pool
                      swimming_pool_type: OUTDOOR
                      availability_type: ALL_SEASON
                      allowed_age_type: ALL_AGES
                      has_pool_bar: true
                      has_free_towels: true
                      has_sun_umbrellas: true
                      is_rooftop: true
                      is_heated: true
                      is_pool_with_view: true
                    surcharge_details:
                      surcharge_type: FREE
                  - swimming_pool_details:
                      name: indoor pool
                      swimming_pool_type: INDOOR
                      availability_type: ALL_SEASON
                      allowed_age_type: ALL_AGES
                      has_loungers: true
                      has_pool_cover: true
                      is_heated: true
                      is_shared: false
                    surcharge_details:
                      surcharge_type: FREE
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '400':
          description: 'Invalid request payload. The `errors` array contains one or more entries with `code: 320`. The `details.fields`
            path identifies the exact field that failed validation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccessObject'
              examples:
                Missing instances for multi-instance facility:
                  description: A multi-instance facility (Parking, Restaurant, Swimming Pool) was submitted without an `instances`
                    array.
                  value:
                    warnings: []
                    errors:
                    - message: Invalid value
                      code: 320
                      details:
                        fields:
                        - property_facility_list[0]
                      description: 'instances required for facility_id: 2'
                    meta:
                      ruid: f5197afa-4ec2-4236-89d1-b18ed4fda4f5
                Missing required details object:
                  description: The `instances` array is present but the required details sub-object is missing. For Parking,
                    both `parking_details` and `payment_details` are required.
                  value:
                    warnings: []
                    errors:
                    - message: Invalid value
                      code: 320
                      details:
                        fields:
                        - property_facility_list[0]
                      description: 'instances.parking_details required for facility_id: 2'
                    meta:
                      ruid: 0073237f-34a3-46b0-bd6c-55629f257761
                Missing required field in details object:
                  description: A required field inside a details object is null or absent. The `details.fields` path pinpoints
                    the exact field.
                  value:
                    warnings: []
                    errors:
                    - message: Invalid value
                      code: 320
                      details:
                        fields:
                        - property_facility_list[0].instances[0].parking_details.name
                        facility_id: 2
                        instance_id: null
                      description: must not be null
                    meta:
                      ruid: X-RUID-EXAMPLE
                Duplicate instance names:
                  description: Two instances of the same multi-instance facility share the same `name`. Names must be unique
                    per facility per property.
                  value:
                    warnings: []
                    errors:
                    - message: Invalid value
                      code: 320
                      details:
                        fields:
                        - property_facility_list[0]
                      description: 'name must be unique for instances in facility_id: 2'
                    meta:
                      ruid: 6dc95763-7ad3-4c76-9f88-e363f84a29f9
                Unrecognized field:
                  description: The request body contains a field name the API does not recognize.
                  value:
                    warnings: []
                    errors:
                    - message: Invalid value
                      code: 320
                      details:
                        fields:
                        - instances.wrong_field
                        facility_id: 2
                        instance_id: null
                      description: Unrecognized field "wrong_field"
                    meta:
                      ruid: X-RUID-EXAMPLE
  /facilities-api/properties/{propertyId}/rooms/{roomId}:
    get:
      tags:
      - Manage room facilities
      summary: Retrieve room facilities set for a property.
      description: Retrieve the facility details for all the facility instances added to the rooms
      operationId: getRoomFacilities
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
      - name: debugInfo
        in: query
        required: false
        description: When set to `true`, attaches room facility metadata (facility names, OTA codes, allowed detail types)
          to each item in the response. Significantly increases payload size. Do not use in production environments.
        schema:
          type: string
          default: 'false'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListRoomFacility'
              example:
                data: []
                warnings: []
                errors: []
                meta:
                  ruid: 59b721b1-7d21-4cce-b847-79e5ccb6399f
    put:
      tags:
      - Manage room facilities
      summary: Manage room-level facilities
      description: Add, modify or delete room-level facilities details for a property
      operationId: setRoomFacilities
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: integer
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RoomFacilityRequest'
            examples:
              Room facilities without additional details:
                description: Room facilities without additional details
                value:
                - room_facility_id: 1
                  state: PRESENT
                - room_facility_id: 3
                  state: MISSING
              Room facilities with additional details:
                description: Room facilities with additional details
                value:
                - room_facility_id: 125
                  state: PRESENT
                  room_facility_instances:
                  - linen_details:
                      has_crib_linen: true
                      has_fitted_sheet: true
                      has_top_sheet: false
                      has_blanket: true
                      has_extra_blankets: false
                      has_pillow: true
                      has_mattress_protector: false
                - room_facility_id: 175
                  state: PRESENT
                  room_facility_instances:
                  - crib_details:
                      is_foldable: false
                      is_standalone: true
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '400':
          description: 'Invalid request payload. The `errors` array contains one or more entries with `code: 320`. The `details.fields`
            path identifies the exact field that failed validation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccessObject'
              examples:
                Unrecognized field in room facility:
                  description: The request body contains a field name the API does not recognize for a room facility instance.
                  value:
                    warnings: []
                    errors:
                    - message: Invalid value
                      code: 320
                      details:
                        fields:
                        - instances.wrong_field
                        room_facility_id: 175
                        instance_id: null
                      description: Unrecognized field "wrong_field"
                    meta:
                      ruid: X-RUID-EXAMPLE
                Missing required field:
                  description: A required field is null or absent. The `details.fields` path pinpoints the exact field.
                  value:
                    warnings: []
                    errors:
                    - message: Invalid value
                      code: 320
                      details:
                        fields:
                        - room_facility_list[0].room_facility_id
                      description: must not be null
                    meta:
                      ruid: X-RUID-EXAMPLE
  /facilities-api/properties/{propertyId}/rooms/{roomId}/bathrooms:
    get:
      tags:
      - Manage bathrooms
      summary: Retrieve room bathroom configuration
      description: Retrieve room bathroom configuration. Bathroom attached to rooms.
      operationId: getBathroomDetails
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: integer
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBathroomDetails'
    put:
      tags:
      - Manage bathrooms
      summary: Manage bathrooms
      description: 'Add, modify or delete room-level bathroom information.


        **Important — overlay semantics:** This endpoint uses full-replace mode. Any bathroom definition absent from the request
        body is permanently deleted. Before updating existing bathroom configuration, call `GET /facilities-api/properties/{propertyId}/rooms/{roomId}/bathrooms`
        to retrieve the current state, then include all existing bathroom entries in your PUT body alongside any changes.'
      operationId: setBathroomDetails
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: integer
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BathroomDetailsRequest'
            examples:
              Enable hotel group bathrooms:
                description: Enable hotel group bathrooms
                value:
                  hotel_bathroom_details:
                    shared_bathroom_state: PRESENT
                    private_bathroom_state: PRESENT
                    number_of_bathrooms: 3
              Add hotel group bathroom details:
                description: Add hotel group bathroom details
                value:
                  hotel_bathroom_details:
                    shared_bathroom_state: MISSING
                    private_bathroom_state: PRESENT
                    private_bathroom_details:
                      type: EXTERNAL_BATHROOM
                      location_type: OTHER
                      location_other: outside of the room
                    number_of_bathrooms: 2
              Add homes group bathroom details:
                description: Add homes group bathroom details
                value:
                  property_bathroom_details:
                    bathrooms:
                    - bathroom_type: PRIVATE
                    - bathroom_type: SHARED
              Add homes group bathroom details with location:
                description: Add homes group bathroom details with location
                value:
                  property_bathroom_details:
                    bathrooms:
                    - bathroom_type: PRIVATE
                      bathroom_location: ENSUITE
                    - bathroom_type: SHARED
                      bathroom_location: OPPOSITE_THE_ROOM
              Add hostel bathroom details:
                description: Add hostel bathroom details
                value:
                  property_bathroom_details:
                    bathrooms:
                    - bathroom_type: PRIVATE
                      bathroom_location: DOWN_THE_HALL
                      hostel_bathroom_details:
                        bathroom_facilities:
                        - type: SHOWER
                          count: 98
                        - type: TOILET
                          count: 21
                        - type: SINK
                          count: 68
                        - type: BATH
                          count: 16
                        - type: TOILET_PAPER
                        - type: HAIR_DRYER
                        - type: SLIPPERS
                          is_paid: true
                        - type: BIDET
                        - type: TOOTHBRUSH
                          is_paid: true
                        - type: SHAMPOO
                          is_paid: false
                        - type: CONDITIONER
                          is_paid: false
                        - type: BODY_SOAP
                          is_paid: true
                        - type: TOWEL
                          is_paid: false
                        - type: HOT_WATER
                    - bathroom_type: SHARED
                      bathroom_location: DOWN_THE_HALL
                      hostel_bathroom_details:
                        gender: MIXED
                        num_guests_with_access_type: NUMBER_LESS_THAN_5
                        bathroom_facilities:
                        - type: SHOWER
                          count: 98
                        - type: TOILET
                          count: 21
                        - type: SINK
                          count: 68
                        - type: BATH
                          count: 16
                        - type: TOILET_PAPER
                        - type: HAIR_DRYER
                        - type: SLIPPERS
                          is_paid: true
                        - type: BIDET
                        - type: TOOTHBRUSH
                          is_paid: true
                        - type: SHAMPOO
                          is_paid: false
                        - type: CONDITIONER
                          is_paid: false
                        - type: BODY_SOAP
                          is_paid: true
                        - type: TOWEL
                          is_paid: true
                        - type: HOT_WATER
              Disable hotel group bathroom details:
                description: Disable hotel group bathroom details
                value:
                  hotel_bathroom_details:
                    shared_bathroom_state: MISSING
                    private_bathroom_state: MISSING
                    number_of_bathrooms: 0
              Remove bathroom details for homes and hostel group:
                description: Remove bathroom details for homes and hostel group
                value:
                  property_bathroom_details:
                    bathrooms: []
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '400':
          description: 'Invalid request payload. The `errors` array contains one or more entries with `code: 320`. The `details.fields`
            path identifies the exact field that failed validation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccessObject'
              examples:
                Hostel private bathroom limit exceeded:
                  description: A hostel property cannot have more than 1 private bathroom.
                  value:
                    warnings: []
                    errors:
                    - message: Invalid value
                      code: 320
                      details:
                        fields:
                        - property_bathroom_details.bathrooms
                      description: Hostel properties support a maximum of 1 private bathroom and 5 shared bathrooms.
                    meta:
                      ruid: X-RUID-EXAMPLE
                Shared hostel bathroom missing required fields:
                  description: A SHARED hostel bathroom must include `gender` and `num_guests_with_access_type`.
                  value:
                    warnings: []
                    errors:
                    - message: Invalid value
                      code: 320
                      details:
                        fields:
                        - property_bathroom_details.bathrooms[0].hostel_bathroom_details.gender
                      description: must not be null
                    meta:
                      ruid: X-RUID-EXAMPLE
                Hotel bathroom state and count inconsistency:
                  description: Both `private_bathroom_state` and `shared_bathroom_state` are MISSING but `number_of_bathrooms`
                    is greater than 0.
                  value:
                    warnings: []
                    errors:
                    - message: Invalid value
                      code: 320
                      details:
                        fields:
                        - hotel_bathroom_details.number_of_bathrooms
                      description: number_of_bathrooms must be 0 when both private_bathroom_state and shared_bathroom_state
                        are MISSING
                    meta:
                      ruid: X-RUID-EXAMPLE
