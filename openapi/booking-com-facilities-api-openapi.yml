          enum:
          - UNKNOWN_FREQUENCY
          - PER_STAY
          - PER_MINUTE
          - PER_HALF_HOUR
          - PER_HOUR
          - PER_DAY
          - PER_WEEK
      description: Charge details
    Daytime:
      type: object
      properties:
        hours:
          maximum: 23
          minimum: 0
          type: integer
          description: Hours, in 24h format
