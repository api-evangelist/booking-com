          - wifi_mobile
          - wifi_router
          x-enumDescriptions:
            additional_driver: Authorises an additional person to drive the vehicle.
            baby_seat: Baby seat for infants up to around 12 months or 9 kg/20 lbs.
            bluetooth_handsfree_kit: Bluetooth device for hands-free phone calls while driving.
            booster_seat: Booster seat for children around 4–11 years old, up to 45 kg/100 lbs.
            child_booster_seat: Booster seat for children around 4–11 years old, up to 45 kg/100 lbs.
            child_seat: Child seat for children around 1–3 years old, up to 18 kg/40 lbs.
            child_seat_isofix: Child safety seat compatible with ISOFIX anchor points.
            etc_card_electronic_toll_collection_card: Electronic toll collection card for automatic toll payments.
            excess_protection: Covers the excess payable in the event of damage or theft.
            fast_track: Equivalent to `queue_jump`.
            gps: Satellite navigation device.
            infant_seat: Infant seat for babies or young children.
            luggage_rack: Additional luggage storage.
            personal_travel_assistant: Travel assistance service.
            queue_jump: Allows travellers to skip the standard queue at pickup.
            roof_rack: Roof-mounted rack for carrying additional luggage or equipment.
            ski_box: Roof-mounted enclosed storage box for skis or luggage.
            ski_rack: Roof-mounted rack designed to transport skis.
            skierized_equipment: Winter sports equipment.
            snow_chains: Tyre chains for snow.
            snow_tyres: Winter tyres.
            wifi_mobile: Mobile WiFi hotspot providing internet access during the rental.
            wifi_router: Portable WiFi router providing internet access.
