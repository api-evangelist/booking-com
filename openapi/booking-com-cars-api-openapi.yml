    availability_insuranceOutput:
      description: 'Detailed third-party insurance quote for this car rental. Returned only for eligible partner configurations (e.g., partners with a signed insurance contract), and when insurance is available for the selected offer (null if not available).

        This object represents a bookable insurance product and includes pricing, coverage, and policy documentation.'
      type:
      - object
      - 'null'
      properties:
        quote_reference:
          description: Unique reference for this insurance quote. Expires after 90 minutes.
          type: string
          examples:
          - 38df45ef-a6fb-4e24-a1d2-66fc3af23d76#1t0juiba8h6n2
        name:
          description: The display name of the insurance product.
          type: string
          examples:
          - Full Protection
        id:
          description: The identifier for the type of insurance product.
          type: string
          examples:
          - '999'
        price:
          description: The price of the insurance product for the full rental period.
