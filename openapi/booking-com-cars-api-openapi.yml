            currency:
              description: The currency of the coverage amount.
              $ref: '#/components/schemas/currencyId'
        documents:
          description: Legal documents for this insurance product. Always returned when the insurance object is present, and always contains the `policy_document` entry. The `ipid` entry is only included when an IPID applies (EEA and UK countries) and is available in the requested language.
          type: array
