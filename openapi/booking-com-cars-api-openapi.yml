  /cars/depots/reviews/scores:
    post:
      description: 'Use this endpoint to return the score breakdown for the specified depots together with the overall number of reviews and score.


        - Please note that the **ratings score is based on all traveller traffic across Booking.com/cars**, and may not necessarily reflect the experience of your own customers.


        - If you choose to display or use these ratings, you are responsible for ensuring that your travellers are properly informed about what these scores represent.'
      summary: Depot scores
      operationId: /depots/reviews/scores
      parameters:
      - $ref: '#/components/parameters/AffiliateIdHeader'
      tags:
      - Cars
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                maximum_results:
                  description: The maximum number of results to return.
                  type: integer
                  multipleOf: 10
                  minimum: 10
                  maximum: 100
                  default: 100
                page:
                  description: Pagination token used to retrieve the next page of results. Obtained from `next_page`.
                  type: string
            example:
              maximum_results: 10
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    description: Uniquely identifies the request. Please provide this identifier when contacting support.
                    type: string
                  data:
                    type: array
                    items:
                      description: ''
                      type: object
                      properties:
                        id:
                          description: Uniquely identifies a depot. The full list can be obtained by calling [/cars/depots](#/cars/depots).
                          type: integer
                          minimum: 1
                          example: 5944
                        breakdown:
                          description: 'Review scores breakdown for each criteria. List of criteria includes: cleanliness, condition, drop_off_speed, efficiency, expense, location, pick_up_speed.'
                          type: object
                          patternProperties:
                            ^(cleanliness|condition|drop_off_speed|friendliness|likeliness_rent_again|location|pick_up_speed|value_for_money)$:
                              type: object
                              properties:
                                score:
                                  description: A decimal number indicating the review score of this criteria, in the range 1..10.
                                  type:
                                  - number
                                  - 'null'
                                  multipleOf: 0.1
                                  minimum: 1
                                  maximum: 10
                        number_of_reviews:
                          description: Number of validated reviews for this depot.
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                        score:
                          description: A decimal number indicating the current review score of this depot, in the range 1..10.
                          type:
                          - number
                          - 'null'
                          multipleOf: 0.1
                          minimum: 1
                          maximum: 10
                  metadata:
                    description: Metadata about the request.
                    type: object
                    properties:
                      next_page:
                        description: Indicates that more results are available. Use this pagination token to retrieve the next page of results (via parameter `page`).
                        type:
                        - string
                        - 'null'
              example:
                request_id: 01fr9ez700exycb98w90w5r9sh
                data:
                - id: 5944
                  breakdown:
                    cleanliness:
                      score: 8.7
                    condition:
                      score: 8.7
                    drop_off_speed:
                      score: 8.7
                    friendliness:
                      score: null
                    likeliness_rent_again:
                      score: 8.7
                    location:
                      score: 8.7
                    pick_up_speed:
                      score: 8.7
                    value_for_money:
                      score: 8.7
                  number_of_reviews: 105
                  score: 9.1
                metadata:
                  next_page: null
