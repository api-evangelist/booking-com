summary: 'Booking.com runs a first-party, anonymous, remote MCP server on its developer portal host. It
  is a DOCUMENTATION server rather than a booking server: it exposes the portal''s own API catalogue,
  endpoint detail, security schemes, full OpenAPI descriptions and full-text search, through a two-tool
  code-execution facade. It is discoverable from the A2A agent card at /.well-known/agent-card.json (capabilities.extensions[0].params.url).'
